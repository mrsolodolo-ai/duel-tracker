  }

  function slots(target, form) {
    return `<div class="stack">${form.map((q, s) => `<div class="slot"><span class="slot-n" aria-hidden="true">${s + 1}</span>
      <div class="seg" role="group" aria-label="Slot ${s + 1} troop type">${['T', 'A', 'M', 'X'].map((t) => `<button type="button" class="t-${t}" data-act="type" data-target="${target}" data-slot="${s}" data-t="${t}" aria-pressed="${q.t === t}" title="${E.TYPE_NAME[t]}">${TS[t]}</button>`).join('')}</div>
      <input id="${target}-p${s}" type="text" inputmode="decimal" autocomplete="off" data-target="${target}" data-slot="${s}" value="${esc(q.p == null ? '' : q.p)}" placeholder="Power, M" aria-label="Slot ${s + 1} power in millions">
    </div>`).join('')}</div>`;
  }
  function tendRows(w, r) {
    const rows = E.EXPERTS.map((e) => ({ label: E.EXPERT_INFO[e].label, blurb: E.EXPERT_INFO[e].blurb, v: w[e] * (r ? 1 - r : 1) }));
    if (r) rows.push({ label: E.REMATCH_INFO.label, blurb: E.REMATCH_INFO.blurb, v: r });
    return rows.sort((x, y) => y.v - x.v).map((x) => `<div class="tend" title="${esc(x.blurb)}"><span>${x.label}</span><div class="bar"><i style="width:${(x.v * 100).toFixed(1)}%"></i></div><span class="pct">${pct(x.v)}</span></div>`).join('');
  }
  const stat = (label, value) => `<div class="stat"><span>${label}</span><b>${value}</b></div>`;

  /* ---------- Next fight ---------- */
  function viewNext() {
    const m = model();
    if (isDemo() && !S.opp && !S.oppManual) setOpp(pickDemoOpp());
    if (S.opp && !S.oppForm) setOpp(S.opp);
    const mf = myForm();
    const pl = S.opp ? m.index.players[key(S.opp)] : null;
    if (S.opp && S.oppVersion !== S.version) {
      const v = valid(S.oppForm);
      if (!S.oppEdited || (pl && v && pl.entries.some((e) => E.sameForm(v, e.form)))) setOpp(S.opp);
      else S.oppVersion = S.version;
    }
    const latest = pl ? pl.entries[pl.entries.length - 1] : null;
    const mine = myLog(), meName = settings().me, hasLog = m.index.battles.length > 0;
    const likely = likelyOpps().filter((x) => key(x.name) !== key(S.opp));
    const src = isDemo() ? 'example squads' : valid(S.personal.myForm) ? 'entered by hand in <a href="#setup">Setup</a>' : mine ? `from your round ${esc(mine.round)} report` : '';
    const meNote = mf ? `<div class="row">${orderHTML(mf)}<span class="meta">${src}</span></div>`
      : meName ? `<p class="meta">No fights logged under this name yet. Add your squads in <a href="#setup">Setup</a>.</p>`
      : `<p class="meta">${hasLog ? 'Your squads fill in from your latest battle report.' : 'Or add your squads in Setup.'}</p>`;

    let opp = `<section class="card c-opp" aria-labelledby="h-opp">
      <div class="card-h"><h2 id="h-opp">Matchup</h2></div>
      <div class="field"><label class="lbl" for="me-pick">You</label>${meSelect('me-pick')}${meNote}</div>
      <div class="vsd" aria-hidden="true">vs</div>
      <div class="field"><label class="lbl" for="opp-pick">Opponent</label>${oppSelect()}</div>
      ${likely.length ? `<div class="stack"><span class="lbl">Likely next, by record</span><div class="quick flow" role="group" aria-label="Likely next opponents">${likely.map((x) => `<button type="button" class="btn small" data-act="opp" data-name="${esc(x.name)}">${esc(short(x.name.replace(/^\[Example\] /, '')))} <span class="rec">${x.w}–${x.l}</span></button>`).join('')}</div></div>` : ''}`;
    const manualOpp = S.oppManual || (!!S.opp && !pl);
    if (S.opp || manualOpp) {
      const meetings = pl && m.meKey ? pl.entries.filter((e) => e.oppKey === m.meKey) : [];
      const open = manualOpp || S.oppOpen || S.oppEdited;
      opp += `<p class="meta">${latest ? `Last logged: round ${esc(latest.round)}, ${latest.won ? 'won' : 'lost'} against ${esc(latest.oppName)}.` : 'Not in the log yet. Enter the formation their battle record shows.'}${meetings.length ? ` <span class="tag hot">Rematch</span> You've met ${meetings.length === 1 ? 'once' : meetings.length + ' times'}.` : ''}</p>`;
      if (!open) {
        opp += `<div class="stack"><div class="lbl"><span>Their last formation</span><span class="hint">Slot 1 fights first</span></div>${orderHTML(valid(S.oppForm) || latest.form)}
          <p class="meta">Game shows a newer one? <button type="button" class="linkbtn" data-act="oedit">Edit it</button></p></div>`;
      } else {
        opp += `<div class="lbl"><span>Their last formation</span><span class="hint">Slot 1 fights first · squad power without troops</span></div>
      ${slots('opp', draftOf('opp'))}
      <div class="lbl"><span>Their last result</span></div>
      <div class="seg" role="group" aria-label="Their last result">
        <button type="button" data-act="ores" data-v="W" aria-pressed="${S.oppResult === 'W'}">Won</button>
        <button type="button" data-act="ores" data-v="L" aria-pressed="${S.oppResult === 'L'}">Lost</button>
        <button type="button" data-act="ores" data-v="" aria-pressed="${!S.oppResult}">Not sure</button>
      </div>
      ${pl && S.oppEdited ? '<p class="meta">This differs from their latest logged fight, so it counts as a newer formation. <button type="button" class="linkbtn" data-act="oreset">Reset to log</button></p>' : pl ? '<p class="meta"><button type="button" class="linkbtn" data-act="oedit">Done</button></p>' : ''}`;
      }
    }
    opp += '</section>';

    let you = '<section class="card c-you" aria-labelledby="h-you"><div class="card-h"><h2 id="h-you">You</h2><a href="#setup">Edit squads</a></div>';
    let pr = null;
    if (mf) {
      const mc = E.canonical(mf).canon, ds = defaultShown(mf);
      const shownK = S.shownPerm != null ? S.shownPerm : ds.k;
      you += `<div class="field"><label class="lbl" for="shown">What they'll see of you</label>
        <select id="shown">${E.PERMS.map((_, k) => `<option value="${k}"${k === shownK ? ' selected' : ''}>${esc(permText(mc, k))}${k === ds.k ? (ds.fromLog ? ' (last fight)' : ' (current)') : ''}</option>`).join('')}</select>
        <p class="meta">They see the formation from your last fight, the same way you see theirs.</p></div>`;
      const of = valid(S.oppForm);
      if (S.opp && of) {
        pr = E.predict(m, { opp: S.opp, oppForm: S.oppEdited ? of : null, oppLastResult: S.oppResult, myForm: mf, myShown: E.orderSquads(mc, shownK) });
      }
    } else {
      you += hasLog && !meName ? '<p>Pick your name under Matchup. Your squads fill in from your latest battle report.</p>'
        : '<p>Add your three squads in Setup so the tracker can simulate your fights.</p><div><a class="btn primary" href="#setup">Go to Setup</a></div>';
    }
    you += '</section>';

    let out;
    if (pr) out = heroCard(pr) + predCard(pr) + mixCard(pr) + mxCard(pr);
    else {
      const msg = !mf ? (hasLog && !meName ? 'Pick your name to get a call.' : 'Add your squads in Setup to get a call.') : !S.opp ? (S.oppManual ? 'Type their name and formation to get a call.' : 'Pick your opponent to get a call.') : 'Enter type and power for all three of their squads to get a call.';
      out = `<section class="card hero c-hero"><div class="card-h"><h2>Play this order</h2></div><div class="empty">${msg}</div></section>`;
    }
    return `<div class="grid-next"><div class="col">${opp}${you}</div><div class="col">${out}</div></div>`;
  }
  function heroCard(pr) {
    const b = pr.best, ev = pr.ev[b], gain = ev - pr.nash.value;
    const others = pr.ranked.slice(1);
    const minAll = Math.min.apply(null, pr.worst), maxAll = Math.max.apply(null, pr.ev);
    const lopsided = minAll >= 0.98 ? 'Every order wins this fight: your squads are far stronger, so order only matters for how many troops you keep.'
      : maxAll <= 0.02 ? 'No order wins this one on paper: their squads are far stronger. The order shown loses the least badly.' : '';
    return `<section class="card hero c-hero" aria-labelledby="h-hero">
      <div class="card-h"><h2 id="h-hero">Play this order</h2><span class="stamp">vs ${esc(short(S.opp))}</span></div>
      ${permHTML(pr.myCanon, b, true)}
      <div class="big-row"><span class="big-num">${pct(ev)}</span><span class="cap">chance to win if they play the way the model expects</span></div>
      ${lopsided ? `<p class="callout">${lopsided}</p>` : `<p class="callout">Worst case ${pct(pr.worst[b])}, if they play ${minis(E.orderSquads(pr.theirCanon, pr.worstAgainst[b]))}. ${gain < 0.02 ? 'Reading this player barely helps here, so the safe mix below is about as good.' : `The safe mix only guarantees ${pct(pr.nash.value)}.`}</p>`}
      <div class="scroll"><table><thead><tr><th>Other orders</th><th>If predicted</th><th>Worst case</th></tr></thead><tbody>
        ${others.map((k) => `<tr><td>${permHTML(pr.myCanon, k)}</td><td>${pct(pr.ev[k])}</td><td>${pct(pr.worst[k])}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="foot">Whatever you play now becomes the formation your next opponent sees.</p>
    </section>`;
  }
  function predCard(pr) {
    const order = E.PERMS.map((_, k) => k).sort((a, b) => pr.p[b] - pr.p[a]);
    const top = order[0];
    let lead;
    if (pr.theirLastPerm == null) lead = `Most likely order: ${pct(pr.p[top])}.`;
    else if (pr.theirLastPerm === top) lead = `Most likely they repeat their last order (${pct(pr.p[top])}).`;
    else lead = `Most likely they switch away from their last order (${pct(pr.p[top])} on the top pick).`;
    const basis = pr.known
      ? `Based on ${plural(pr.nFights, 'logged fight')}${pr.extraSeen ? ' plus the formation you entered' : ''}. Players with few fights lean on how your whole log behaves.`
      : 'No fights logged for this player, so this uses how opponents in your log usually play.';
    const rm = pr.rematch;
    const rmBox = rm ? `<div class="rematch"><p><span class="tag hot">Rematch</span> In round ${esc(rm.round)} they played ${minis(rm.theirForm)} against your ${minis(rm.myForm)} and ${rm.theyWon ? 'won' : 'lost'}. ${rm.theyWon ? 'A player who remembers would replay the order that beat you.' : 'A player who remembers would counter the order that beat them.'}</p>
      <p class="meta">The model gives that ${pct(rm.r)} weight, ${rm.n ? `from their ${plural(rm.n, 'earlier rematch')} and your whole log` : 'from how players in your log handle rematches'}.</p></div>` : '';
    return `<section class="card c-pred" aria-labelledby="h-pred">
      <div class="card-h"><h2 id="h-pred">Their likely order</h2></div>
      <p class="lead">${lead}</p>
      ${rmBox}
      <div class="stack">${order.map((k, i) => `<div class="prow${i === 0 ? ' top' : ''}"><span class="row">${permHTML(pr.theirCanon, k)}${k === pr.theirLastPerm ? '<span class="tag">Last played</span>' : ''}</span><div class="bar${i ? ' muted' : ''}"><i style="width:${(pr.p[k] * 100).toFixed(1)}%"></i></div><span class="pct">${pct(pr.p[k])}</span></div>`).join('')}</div>
      <div class="lbl"><span>How they decide</span></div>
      <div class="stack">${tendRows(pr.weights, rm ? rm.r : 0)}</div>
      <p class="foot">${basis}</p>
    </section>`;
  }
  function mixCard(pr) {
    const rows = E.PERMS.map((_, k) => k).filter((k) => pr.nash.row[k] > 0).sort((a, b) => pr.nash.row[b] - pr.nash.row[a]);
    return `<section class="card c-mix" aria-labelledby="h-mix">
      <div class="card-h"><h2 id="h-mix">Safe mix</h2><span class="aside">floor ${pct(pr.nash.value)}</span></div>
      <p>If you'd rather not be read, pick at random with these odds. Whatever they play, you win at least ${pct(pr.nash.value)} of the time.</p>
      <div class="stack">${rows.map((k) => `<div class="prow"><span>${permHTML(pr.myCanon, k)}</span><div class="bar muted"><i style="width:${(pr.nash.row[k] * 100).toFixed(1)}%"></i></div><span class="pct">${pct(pr.nash.row[k])}</span></div>`).join('')}</div>
      <div class="row"><button type="button" class="btn" data-act="roll">Pick one for me</button>${S.roll != null ? `<span class="row">Play ${permHTML(pr.myCanon, S.roll)}</span>` : ''}</div>
    </section>`;
  }
  function mxCard(pr) {
    const cols = E.PERMS.map((_, k) => k).sort((a, b) => pr.p[b] - pr.p[a]);
    const cell = (v) => {
      const d = Math.min(55, Math.abs(v - 0.5) * 2 * 55).toFixed(0);
      return `background: color-mix(in oklab, ${v >= 0.5 ? 'var(--win)' : 'var(--loss)'} ${d}%, var(--panel))`;
    };
    return `<section class="card c-mx"><details><summary>All 36 matchups: your win chance</summary>
      <div class="scroll"><table class="mx"><thead><tr><th>You \\ They</th>${cols.map((j) => `<th>${minis(E.orderSquads(pr.theirCanon, j))}<span class="p">${pct(pr.p[j])}</span></th>`).join('')}</tr></thead>
      <tbody>${pr.ranked.map((i) => `<tr><th>${minis(E.orderSquads(pr.myCanon, i))}</th>${cols.map((j) => `<td class="cell" style="${cell(pr.Wme[i][j])}">${pct(pr.Wme[i][j])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="meta">Columns are their orders, most likely first, with the model's odds under each. Rows are your orders, best first.</p></details></section>`;
  }

  /* ---------- Opponents ---------- */
  function viewOpponents() {
    const m = model(), list = players();
    if (!list.length) return '<div class="empty">No opponents logged yet. Add battle reports in the <a href="#log">Battle log</a>.</div>';
    const sk = S.sel && m.index.players[S.sel] && S.sel !== m.meKey ? S.sel : list[0].key;
    const p = m.index.players[sk], w = m.playerW[sk], obs = m.obsBy[sk], calls = wf().calls[sk] || [];
    const scored = calls.filter(Boolean), hits = scored.filter((c) => c.hit).length;
    const latest = p.entries[p.entries.length - 1];
    const left = `<section class="card"><div class="card-h"><h2>Opponents</h2><span class="aside">${list.length}</span></div>
      <div class="plist">${list.map((q) => `<button type="button" data-act="sel" data-k="${esc(q.key)}" aria-current="${q.key === sk}"><span class="nm"><span>${esc(q.name)}</span><span class="meta">${q.w}–${q.n - q.w}</span></span><span class="row">${minis(q.last.form)}<span class="meta">${E.EXPERT_INFO[topTendency(m.playerW[q.key])].label}</span></span></button>`).join('')}</div></section>`;
    const rows = p.entries.map((e, t) => ({ e, t })).reverse().map(({ e, t }) => {
      const o = obs[t], c = calls[t];
      const call = c ? (c.hit ? '<span class="ok">Right</span>' : `<span class="bad">Missed</span> ${minis(E.orderSquads(o.canon, c.top))}`) : '<span class="meta">First fight</span>';
      return `<tr><td class="num">${esc(e.round)}</td><td>${orderHTML(e.form)}</td><td>${esc(e.oppName)}${o.rm ? ' <span class="tag">Rematch</span>' : ''}</td><td>${o.seen.proxy ? '<span class="meta" title="Their opponent’s earlier fight isn’t logged, so this shows what that opponent played here">~</span> ' : ''}${minis(o.seen.lastForm)}</td><td>${e.won ? '<span class="pill w">Won</span>' : '<span class="pill l">Lost</span>'}</td><td>${call}</td></tr>`;
    }).join('');
    const right = `<section class="card"><div class="card-h"><h2>${esc(p.name)}</h2><button type="button" class="btn small primary" data-act="scout" data-name="${esc(p.name)}">Scout as next opponent</button></div>
      <div class="row"><span class="lbl">Latest order</span>${orderHTML(latest.form)}</div>
      <div class="lbl"><span>How they decide</span><span class="hint">${scored.length ? `Model called ${hits} of ${scored.length} of their fights right` : 'Needs two fights to test the model'}</span></div>
      <div class="stack">${tendRows(w)}</div>
      ${m.playerRm[sk].n ? `<p class="meta">In ${plural(m.playerRm[sk].n, 'rematch')}, the model puts ${pct(m.playerRm[sk].r)} weight on them remembering the last meeting (replaying what won, or countering what beat them).</p>` : ''}
      <div class="scroll"><table><thead><tr><th>Round</th><th>Played</th><th>Against</th><th>They could see</th><th>Result</th><th>Model's call</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="meta">"They could see" is their opponent's formation from the round before. A ~ means that fight isn't logged, so it shows what the opponent played in this one. Each call uses only fights logged before it.</p>
    </section>`;
    return `<div class="grid-opp">${left}${right}</div>`;
  }

  /* ---------- Battle log ---------- */
  function form() {
    if (!S.form) {
      const st = baseSettings(), rounds = S.battles.map((b) => +b.round).filter(isFinite);
      S.form = { round: rounds.length ? String(Math.max.apply(null, rounds)) : '1', a: { name: st.me || '', s: st.myForm ? clone(st.myForm) : blank(), touched: false }, b: { name: '', s: blank(), touched: false }, win: '' };
    }
    return S.form;
  }
  function prefillSide(sd) {
    const f = form(), s = f[sd];
    if (s.touched || !s.name) return;
    const pl = fullIndex().players[key(s.name)];
    if (pl) s.s = clone(pl.entries[pl.entries.length - 1].form);
    else if (key(s.name) === key(baseSettings().me) && baseSettings().myForm) s.s = clone(baseSettings().myForm);
  }
  function viewLog() {
    const f = form();
    // One copy of each fight; with several groups loaded, show your own group unless asked for all.
    const G = groupInfo(), meK = key(settings().me), myR = G.ix.players[meK] ? G.comp[meK] : null;
    const scoped = !S.logAll && G.roots.length > 1 && !!myR;
    const list = G.ix.battles.filter((b) => !scoped || G.comp[key(b.a.name)] === myR).slice().sort((x, y) => (+y.round - +x.round) || String(y.created || '').localeCompare(String(x.created || '')));
    const side = (sd, label) => `<div class="side${f.win === sd ? ' won' : ''}">
      <div class="field"><label class="lbl" for="f-${sd}-name">${label}</label><input id="f-${sd}-name" type="text" list="dl-all" autocomplete="off" spellcheck="false" value="${esc(f[sd].name)}" placeholder="Player name"></div>
      ${slots(sd, f[sd].s)}</div>`;
    const add = `<section class="card" aria-labelledby="h-add"><div class="card-h"><h2 id="h-add">Add a battle report</h2><span class="aside">From the duel's Record screen</span></div>
      <div class="row"><div class="field" style="width:120px"><label class="lbl" for="f-round">Round</label><input id="f-round" type="text" inputmode="decimal" value="${esc(f.round)}"></div>
        <p class="meta" style="max-width:46ch">The qualifier fight number. Any number that goes up with time works, as long as everyone's fights use the same scale.</p></div>
      <div class="sides">${side('a', 'Side A')}${side('b', 'Side B')}</div>
      <div class="row"><span class="lbl">Winner</span><div class="seg" role="group" aria-label="Winner">
        <button type="button" data-act="fwin" data-v="a" aria-pressed="${f.win === 'a'}">${esc(short(f.a.name || 'Side A'))}</button>
        <button type="button" data-act="fwin" data-v="b" aria-pressed="${f.win === 'b'}">${esc(short(f.b.name || 'Side B'))}</button></div></div>
      <div class="row"><button type="button" class="btn primary" data-act="fsave"${canAdd() ? '' : ' disabled'}>Save battle</button><span class="meta" role="status">${esc(canAdd() ? S.formMsg : 'You have view access. Ask the owner for Contributor access to add reports.')}</span></div>
      <p class="meta">Side A stays filled after saving, so you can log the next fight from the same player's record.</p>
    </section>`;
    const shown = S.showAll ? list : list.slice(0, 60);
    const rows = shown.map((b) => {
      const n = E.normBattle(b);
      if (!n) return '';
      let del = '';
      if (!isDemo() && b.id && canAdmin()) {
        del = S.confirm === b.id
          ? `<span class="row"><button type="button" class="btn small danger" data-act="del" data-id="${esc(b.id)}">Delete</button><button type="button" class="btn small" data-act="nodel">Keep</button></span>`
          : `<button type="button" class="btn small" data-act="askdel" data-id="${esc(b.id)}" aria-label="Delete round ${esc(n.round)}, ${esc(n.a.name)} against ${esc(n.b.name)}">Delete</button>`;
      }
      const who = (sd) => `<div class="who"><span class="nm">${esc(n[sd].name)}</span>${n.win === sd ? '<span class="pill w">Won</span>' : ''}${orderHTML(n[sd].s)}</div>`;
      return `<div class="b"><span class="rd" title="Round">${esc(n.round)}</span><div class="vs">${who('a')}${who('b')}</div>${del}</div>`;
    }).join('');
    const logCard = `<section class="card" aria-labelledby="h-list"><div class="card-h"><h2 id="h-list">Battles</h2><span class="row"><span class="aside">${list.length.toLocaleString()}${scoped ? ' in ' + esc(groupName(G, myR)) : ''}</span>${G.roots.length > 1 && myR ? `<button type="button" class="btn small" data-act="logall">${S.logAll ? 'Only my group' : 'All groups'}</button>` : ''}</span></div>
      ${list.length ? `<div class="blist">${rows}</div>${list.length > shown.length ? `<button type="button" class="btn" data-act="all">Show all ${list.length}</button>` : ''}` : '<div class="empty">Nothing logged yet.</div>'}</section>`;
    return `<div class="stack" style="gap:16px">${add}${logCard}</div>`;
  }

  /* ---------- Patterns ---------- */
  function viewPatterns() {
    const m = model();
    const keys = Object.keys(m.obsBy).filter((k) => k !== m.meKey);
    const all = [].concat.apply([], keys.map((k) => m.obsBy[k]));
    if (!all.length) return '<div class="empty">Patterns appear once you’ve logged some battles.</div>';
    const st = E.habitStats(all), W = wf(), r = (a, b) => (b ? pct(a / b) : '–');
    const pop = `<section class="card"><div class="card-h"><h2>How your opponents decide</h2><span class="aside">${plural(all.length, 'fight')}, ${plural(keys.length, 'player')}</span></div>
      <div class="stack">${tendRows(m.popW)}</div>
      <div>${stat('Kept the same order as their previous fight', r(st.kept, st.withPrev))}
        ${stat('Kept it after a win', r(st.keptAfterWin, st.afterWin))}
        ${stat('Kept it after a loss', r(st.keptAfterLoss, st.afterLoss))}
        ${stat(`Played the best counter to what they could see <span class="meta">(random picks would: ${r(st.counterChance, st.n)})</span>`, r(st.countered, st.n))}
        ${stat('Led with their strongest squad', r(st.strongestFirst, st.n))}
        ${st.rematch ? stat(`Rematches <span class="meta">(${st.rematch})</span>: replayed the order that won last time`, r(st.rmReplayed, st.rmWonPrev)) + stat('Rematches: countered the order that beat them last time', r(st.rmCountered, st.rmLostPrev)) + stat('Rematch memory, model weight', pct(m.popRm.r)) : ''}</div>
      <p class="meta">New opponents start from this mix until their own fights say otherwise.</p></section>`;
    const track = `<section class="card"><div class="card-h"><h2>Model track record</h2></div>
      ${W.n ? `<div class="big-row"><span class="big-num">${pct(W.acc)}</span><span class="cap">of logged fights where the model's top pick was the order they actually played</span></div>
        <div>${stat('Guessing they repeat their last order', pct(W.repeatAcc))}${W.rmN ? stat(`On rematches only <span class="meta">(${W.rmN})</span>`, pct(W.rmHits / W.rmN)) : ''}${stat('Blind guess', '17%')}${stat('Average odds it gave the order they played', pct(W.avgP))}</div>
        <p class="meta">Each fight is called using only the fights before it, over ${plural(W.n, 'call')}.</p>` : '<p>Needs players with at least two logged fights.</p>'}</section>`;
    const mine = m.obsBy[m.meKey] || [];
    let me = '<section class="card"><div class="card-h"><h2>How readable you are</h2></div>';
    if (mine.length >= 2) {
      const ms = E.habitStats(mine), mw = wfMe();
      me += `<div class="stack">${tendRows(m.playerW[m.meKey])}</div>
        <div>${stat('You kept your previous order', r(ms.kept, ms.withPrev))}${mw && mw.n ? stat('The model would have called your order', pct(mw.acc)) : ''}</div>
        <p class="meta">This is how your opponents' scouting sees you. If you're easy to read, the safe mix on Next fight keeps you hard to counter.</p>`;
    } else {
      me += `<p>Log at least two of your own fights${baseSettings().me ? '' : ' and set your name in Setup'} to see how predictable you are.</p>`;
    }
    me += '</section>';
    const st2 = settings(), nb = isDemo() ? 0 : S.battles.length;
    let tune = `<section class="card"><div class="card-h"><h2>Tune the fight simulator</h2></div>
      <p>Right now a counter squad fights as if it had ${pct(+st2.bonus, 1)} more power, and real strength can drift about ${pct(+st2.sigma, 1)} from listed power.</p>`;
    if (isDemo()) tune += '<p class="meta">Tuning works on your own battles, not the example data.</p>';
    else if (nb < 8) tune += `<p class="meta">Log at least 8 battles to tune it (you have ${nb}).</p>`;
    else tune += `<div><button type="button" class="btn" data-act="cal"${S.busy ? ' disabled' : ''}>${S.busy === 'cal' ? 'Tuning…' : 'Tune to my battles'}</button></div>`;
    if (S.cal && !isDemo()) {
      const c = S.cal, same = Math.abs(c.best.bonus - st2.bonus) < 1e-9 && Math.abs(c.best.sigma - st2.sigma) < 1e-9 && Math.abs((c.best.attr || 1.5) - (+st2.attr || 1.5)) < 1e-9;
      tune += `<p>Best fit on ${c.level === 'encounter' ? `${plural(c.n, 'encounter')} from ${plural(c.battles, 'battle')}` : plural(c.n, 'battle')}: counter edge ${pct(c.best.bonus, 1)}, drift ${pct(c.best.sigma, 1)}. With those settings the stronger side wins ${pct(c.accuracy)} of the logged ${c.level === 'encounter' ? 'encounters' : 'fights'}.</p>
        ${same ? '<p class="meta">The tracker already uses these settings.</p>' : canAdmin() ? '<div><button type="button" class="btn primary" data-act="calapply">Use these settings</button></div>' : '<p class="meta">Only the tracker\'s owner can change these settings.</p>'}`;
    }
    tune += '</section>';
    return `<div class="grid2"><div class="stack" style="gap:16px">${pop}${me}</div><div class="stack" style="gap:16px">${track}${tune}</div></div>`;
  }

  /* ---------- Setup ---------- */
  function exportJSON() {
    return JSON.stringify(S.battles.map((b) => { const n = E.normBattle(b); return n ? Object.assign({ round: n.round }, n.g ? { g: n.g } : {}, { a: n.a, b: n.b, win: n.win }, n.e ? { e: n.e } : {}) : null; }).filter(Boolean));
  }
  function viewSetup() {
    const st = S.shared, ro = canAdmin() ? '' : ' disabled';
    const privacy = S.store !== 'db' ? 'Saved in this browser.' : S.personalStore === 'db' ? 'Only you see these. Each teammate sets their own.' : 'Saved in this browser only.';
    const mine = isDemo() ? null : myLog();
    let squads;
    if (mine && !valid(S.personal.myForm)) {
      squads = `<div class="lbl"><span>Your squads</span><span class="hint">From your round ${esc(mine.round)} battle report</span></div>
      <div>${orderHTML(mine.form)}</div>
      <p class="meta">These update by themselves when newer reports are imported. Power changed since then? <button type="button" class="linkbtn" data-act="mehand">Enter squads by hand</button></p>`;
    } else {
      const d = draftOf('me');
      squads = `<div class="lbl"><span>Your squads, in your current order</span><span class="hint">Slot 1 fights first</span></div>
      ${slots('me', d)}
      <p class="meta">${valid(d) ? 'Saved.' : 'Enter type and power for all three squads.'} Use each squad's power as the game shows it (hero power, without troops), and update it after you re-save your duel formation.${mine ? ' <button type="button" class="linkbtn" data-act="melog">Use my latest battle report instead</button>' : ''}</p>`;
    }
    const you = `<section class="card" aria-labelledby="h-me"><div class="card-h"><h2 id="h-me">You</h2><span class="aside">${privacy}</span></div>
      <div class="field"><label class="lbl" for="${isDemo() ? 'me-name' : 'set-me'}">Your name in the duel</label>${meSelect('set-me')}
        <p class="meta">Battles under this name count as yours, so the tracker knows what opponents have seen of you.</p></div>
      ${squads}</section>`;
    const sim = `<section class="card" aria-labelledby="h-sim"><div class="card-h"><h2 id="h-sim">Fight simulator</h2></div>
      <div class="three">
        <div class="field"><label class="lbl" for="set-bonus">Counter edge, %</label><input id="set-bonus" type="text" inputmode="decimal" value="${+(st.bonus * 100).toFixed(1)}"${ro}><p class="meta">A squad whose type beats its opponent's fights as if it had this much more power.</p></div>
        <div class="field"><label class="lbl" for="set-sigma">Hidden strength, ± %</label><input id="set-sigma" type="text" inputmode="decimal" value="${+(st.sigma * 100).toFixed(1)}"${ro}><p class="meta">How far real strength can drift from listed power (heroes, gear, skills).</p></div>
        <div class="field"><label class="lbl" for="set-sims">Simulations per matchup</label><select id="set-sims"${ro}>${[800, 1500, 3000].map((n) => `<option value="${n}"${+st.sims === n ? ' selected' : ''}>${n.toLocaleString()}</option>`).join('')}</select><p class="meta">More is steadier but slower.</p></div>
      </div>${canAdmin() ? '' : '<p class="meta">These are shared by the whole team. Only the tracker\'s owner can change them.</p>'}</section>`;
    const team = S.store !== 'db' ? '' : `<section class="card" aria-labelledby="h-team"><div class="card-h"><h2 id="h-team">Team</h2></div><div class="prose">
      <p>Everyone you share this page with sees the same battle log and opponent profiles. ${S.bundle.length ? `Battle reports from all ${groupInfo().roots.length} qualifier groups are built in, so most players can find their own name. ` : ''}Each teammate picks their own name once on Next fight, and their squads fill in from their latest battle report. Names stay private to each person, so everyone gets calls for their own fights.</p>
      ${S.isOwner ? '<p>To add teammates, use Share on this page in claude.ai. Give them Contributor access so they can add battle reports and keep their name saved wherever they open the page. Viewers can scout too, but their name is saved in their browser only and they can\'t add reports.</p>'
        : canAdd() ? '<p>You can add battle reports to the shared log. Only the owner can delete battles or change the fight simulator.</p>'
        : '<p>You have view access: you can scout, your name is saved in this browser only, and you can\'t add reports. Ask the owner for Contributor access to add reports.</p>'}</div></section>`;
    const data = `<section class="card" aria-labelledby="h-data"><div class="card-h"><h2 id="h-data">Data</h2><span class="aside">${plural(S.battles.length, 'battle')} logged here${S.bundle.length ? `, ${S.bundle.length.toLocaleString()} from reports` : ''}</span></div>
      <div class="field"><span class="lbl">Export</span>
        <div class="row"><button type="button" class="btn" data-act="copy">Copy all battles</button>${S.showExport ? '' : '<button type="button" class="btn" data-act="showexp">Show</button>'}<span class="meta" role="status">${esc(S.copyMsg)}</span></div>
        ${S.showExport ? `<textarea id="exp" readonly aria-label="Exported battles">${esc(exportJSON())}</textarea>` : ''}</div>
      <div class="field"><label class="lbl" for="imp">Import battles</label><textarea id="imp" placeholder='[{"round":3,"a":{"name":"Kestrel","s":[{"t":"T","p":48.2},{"t":"A","p":45.1},{"t":"M","p":40.3}]},"b":{"name":"Odin","s":[{"t":"A","p":50.0},{"t":"M","p":44.2},{"t":"T","p":39.8}]},"win":"a"}]'>${esc(S.importText)}</textarea>
        <div class="row"><button type="button" class="btn primary" data-act="import"${S.busy ? ' disabled' : ''}>${S.busy === 'import' ? 'Importing…' : 'Import'}</button><span class="meta" role="status">${esc(S.importMsg)}</span></div>
        <p class="meta">Paste a list of battles in the format above. Battles already logged are skipped.</p></div>
      <div class="row">${S.wipe ? `<span>Delete all ${plural(S.battles.length, 'battle')}? This can't be undone.</span><button type="button" class="btn danger" data-act="wipe2"${S.busy ? ' disabled' : ''}>Delete everything</button><button type="button" class="btn" data-act="wipe0">Keep them</button>` : `${canAdmin() ? `<button type="button" class="btn danger" data-act="wipe1"${S.battles.length ? '' : ' disabled'}>Delete all battles</button>` : ''}`}</div>
    </section>`;
    const how = `<section class="card" aria-labelledby="h-how"><div class="card-h"><h2 id="h-how">How the tracker works</h2></div><div class="prose">
      <p>Each encounter, both sides send the next squad in line. The winner goes to the back of its line with the troops it has left; the loser is out. The fight ends when one side has no squads left, so it takes 3 to 5 encounters. This rule matched every one of 391 encounters in real battle reports.</p>
      <p>The simulator plays all 36 pairings of your order against theirs, ${(+st.sims || 1500).toLocaleString()} times each, letting every squad's real strength drift about ${pct(+st.sigma, 1)} from its listed power. A squad whose type beats its opponent's (Tank beats Missile, Missile beats Aircraft, Aircraft beats Tank) fights as if it had ${pct(+st.bonus, 1)} more power. Both numbers were fitted to real encounters: power decides almost everything, and the counter edge is small.</p>
      <p>To predict an opponent, the tracker replays their logged fights against six habits: repeating their last order, leading with their strongest squad, countering the formation they could see, keeping a winning order and changing a losing one, second-guessing, and picking at random. It learns how much of each habit that player shows. Players with only a few fights lean on how everyone in your log behaves.</p>
      <p>When you meet someone again, they know exactly what you played against them last time. The tracker adds a seventh habit for rematches: replay the order that won, or counter the order that beat them. It learns how often each player does that.</p>
      <p>The call is the order that wins most often against that prediction. The safe mix is the game-theory answer: odds that guarantee a minimum win chance whatever they play, for when you'd rather not be read.</p>
      <p>Anyone with Contributor access can log battle reports here, and the owner can ask Claude to import whole groups straight from the duel's battle reports.</p></div></section>`;
    return `<div class="grid2"><div class="stack" style="gap:16px">${you}${team}${sim}</div><div class="stack" style="gap:16px">${data}${how}</div></div>`;
  }

  const VIEW = { next: viewNext, opponents: viewOpponents, log: viewLog, patterns: viewPatterns, setup: viewSetup };

  /* ---------- actions ---------- */
  async function saveForm() {
    const f = form(), r = parseFloat(f.round), a = valid(f.a.s), b = valid(f.b.s);
    const an = (f.a.name || '').trim(), bn = (f.b.name || '').trim();
    let err = '';
    if (!isFinite(r)) err = 'Enter the round number.';
    else if (!an || !bn) err = 'Enter both player names.';
    else if (key(an) === key(bn)) err = 'The two sides need different names.';
    else if (!a || !b) err = 'Enter type and power for all six squads.';
    else if (f.win !== 'a' && f.win !== 'b') err = 'Pick who won.';
    if (err) { S.formMsg = err; render(); return; }
    const battle = { round: r, a: { name: an, s: a }, b: { name: bn, s: b }, win: f.win, note: '', created: new Date().toISOString() };
    const k = E.battleKey(battle);
    if (S.battles.some((x) => { const n = E.normBattle(x); return n && E.battleKey(n) === k; })) { S.formMsg = `Round ${r}, ${an} against ${bn}, is already logged.`; render(); return; }
    try {
      await addBattles([battle]);
      S.formMsg = `Saved round ${r}: ${an} against ${bn}.`;
      f.b = { name: '', s: blank(), touched: false }; f.win = '';
    } catch (e) { S.formMsg = errText(e); }
    render();
  }
  async function doImport() {
    let data;
    try { data = JSON.parse(S.importText); } catch (e) { S.importMsg = 'That isn’t valid JSON. Paste exactly what was exported, or what Claude gave you.'; render(); return; }
    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.battles) ? data.battles : null);
    if (!arr) { S.importMsg = 'Expected a list of battles.'; render(); return; }
    // An older copy of a fight that doesn't know its group is replaced by an imported copy that does.
    const have = new Map(), ids = new Set();
    S.battles.forEach((x) => { ids.add(x.id); const n = E.normBattle(x); if (n) have.set(E.battleKey(n), { id: x.id, g: !!n.g }); });
    S.bundle.forEach((x) => { if (x._id != null) ids.add(String(x._id)); const n = E.normBattle(x); if (n) have.set(E.battleKey(n), { id: null, g: true }); });
    const add = [], stale = []; let bad = 0, dup = 0;
    arr.forEach((raw) => {
      const n = E.normBattle(raw);
      if (!n) { bad++; return; }
      const k = E.battleKey(n), old = have.get(k), rid = raw._id != null ? String(raw._id).replace(/[^\w-]/g, '_') : '';
      if ((old && (old.g || !n.g)) || (rid && ids.has(rid))) { dup++; return; }
      if (old && old.id) stale.push(old.id);
      have.set(k, { id: rid || null, g: !!n.g });
      const doc = { round: n.round, a: n.a, b: n.b, win: n.win, note: n.note || '', created: new Date().toISOString() };
      if (n.g) doc.g = n.g;
      if (n.e) doc.e = n.e;
      if (rid) doc._id = rid;
      add.push(doc);
    });
    if (!add.length) { S.importMsg = `Nothing new to add (${dup} already logged, ${bad} unreadable).`; render(); return; }
    S.importText = ''; S.busy = 'import'; render();
    let shown = 0, removed = 0;
    try {
      await addBattles(add, (i, n) => { if (i === n || Date.now() - shown > 700) { shown = Date.now(); S.importMsg = `Saving ${i} of ${n}…`; render(); } });
      if (stale.length && canAdmin()) {
        if (S.store === 'db') { for (const id of stale) { try { await retrying(() => S.db.doc('battles/' + id).delete()); removed++; } catch (e) { /* the newer copy is used anyway */ } } }
        else { const st = new Set(stale); S.battles = S.battles.filter((x) => !st.has(x.id)); removed = stale.length; saveLocal(); }
      }
      S.importMsg = `Imported ${plural(add.length, 'battle')}${dup ? `, skipped ${dup} already logged` : ''}${removed ? `, replaced ${removed} older ${removed === 1 ? 'copy' : 'copies'}` : ''}${bad ? `, ${bad} unreadable` : ''}.`;
    } catch (e) { S.importMsg = errText(e); }
    S.busy = ''; bump(); render();
  }
  async function wipeAll() {
    S.busy = 'wipe'; render();
    try {
      if (S.store === 'db') { for (const b of S.battles.slice()) await S.db.doc('battles/' + b.id).delete(); }
      else { S.battles = []; saveLocal(); bump(); }
    } catch (e) { showErr(e); }
    S.busy = ''; S.wipe = 0; render();
  }

  document.addEventListener('click', async (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const a = el.dataset.act;
    if (a === 'real') { S.forceReal = true; location.hash = '#setup'; render(); }
    else if (a === 'dismiss') { S.note = ''; S.noteErr = false; render(); }
    else if (a === 'opp') { setOpp(el.dataset.name); S.oppOpen = false; render(); }
    else if (a === 'oedit') { S.oppOpen = !S.oppOpen; render(); }
    else if (a === 'melog') { S.personal.myForm = null; S.meDraft = null; S.shownPerm = null; S.roll = null; savePersonal(); render(); }
    else if (a === 'mehand') {
      const lf = myLog();
      if (lf) { S.meDraft = clone(lf.form); S.personal.myForm = valid(S.meDraft); S.shownPerm = null; S.roll = null; savePersonal(); }
      render();
    }
    else if (a === 'type') { const d = draftOf(el.dataset.target); if (d) { d[+el.dataset.slot].t = el.dataset.t; afterDraft(el.dataset.target); render(); } }
    else if (a === 'ores') { S.oppResult = el.dataset.v || null; S.roll = null; render(); }
    else if (a === 'oreset') { setOpp(S.opp); S.oppOpen = false; render(); }
    else if (a === 'roll') {
      const mf = myForm(), of = valid(S.oppForm);
      if (!mf || !of) return;
      const mc = E.canonical(mf).canon, ds = defaultShown(mf);
      const pr = E.predict(model(), { opp: S.opp, oppForm: S.oppEdited ? of : null, oppLastResult: S.oppResult, myForm: mf, myShown: E.orderSquads(mc, S.shownPerm != null ? S.shownPerm : ds.k) });
      const x = Math.random(); let s = 0, pick = 5;
      for (let k = 0; k < 6; k++) { s += pr.nash.row[k]; if (x <= s) { pick = k; break; } }
      S.roll = pick; render();
    }
    else if (a === 'sel') { S.sel = el.dataset.k; render(); }
    else if (a === 'scout') { setOpp(el.dataset.name); S.oppOpen = false; location.hash = '#next'; render(); }
    else if (a === 'fwin') { form().win = el.dataset.v; render(); }
    else if (a === 'fsave') { saveForm(); }
    else if (a === 'askdel') { S.confirm = el.dataset.id; render(); }
    else if (a === 'nodel') { S.confirm = null; render(); }
    else if (a === 'del') { const id = el.dataset.id; S.confirm = null; try { await deleteBattle(id); } catch (e) { showErr(e); } render(); }
    else if (a === 'all') { S.showAll = true; render(); }
    else if (a === 'logall') { S.logAll = !S.logAll; S.showAll = false; render(); }
    else if (a === 'cal') {
      S.busy = 'cal'; render();
      setTimeout(() => { try { S.cal = E.calibrate(battles(), settings()); } catch (e) { S.cal = null; } S.busy = ''; render(); }, 40);
    }
    else if (a === 'calapply' && S.cal && canAdmin()) { S.shared.bonus = S.cal.best.bonus; S.shared.sigma = S.cal.best.sigma; if (S.cal.best.attr) S.shared.attr = S.cal.best.attr; saveShared(); render(); }
    else if (a === 'copy') {
      try { await navigator.clipboard.writeText(exportJSON()); S.copyMsg = 'Copied.'; render(); }
      catch (e) {
        S.showExport = true; S.copyMsg = 'Copying was blocked. The text is selected, so copy it yourself.'; render();
        setTimeout(() => { const t = document.getElementById('exp'); if (t) { t.focus(); t.select(); } }, 80);
      }
    }
    else if (a === 'import') { doImport(); }
    else if (a === 'showexp') { S.showExport = true; render(); }
    else if (a === 'wipe1') { S.wipe = 1; render(); }
    else if (a === 'wipe0') { S.wipe = 0; render(); }
    else if (a === 'wipe2' && canAdmin()) { wipeAll(); }
  });

  const isPick = (ev) => ev.inputType === 'insertReplacementText' || ev.inputType == null;
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset && t.dataset.target && t.dataset.slot != null) { const d = draftOf(t.dataset.target); if (d) d[+t.dataset.slot].p = t.value; return; }
    if (t.id === 'opp-name') {
      S.oppText = t.value;
      if (isPick(ev) && fullIndex().players[key(t.value)]) { setOpp(t.value); render(); }
      return;
    }
    if (t.id === 'f-round') { form().round = t.value; return; }
    if (t.id === 'f-a-name' || t.id === 'f-b-name') {
      const sd = t.id.charAt(2); form()[sd].name = t.value;
      if (isPick(ev) && fullIndex().players[key(t.value)]) { prefillSide(sd); render(); }
      return;
    }
    if (t.id === 'me-name') { S.meText = t.value; return; }
    if (t.id === 'imp') { S.importText = t.value; }
  });
  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.id === 'me-pick' || t.id === 'set-me') {
      if (t.value === OTHER) { S.meManual = true; S.meText = null; render(); focusSoon('me-name'); return; }
      pickMe(t.value); return;
    }
    if (t.id === 'me-name') {
      const v = t.value.trim(); S.meText = null;
      if (v && fullIndex().players[key(v)]) { pickMe(v); return; }
      if (key(v) !== key(baseSettings().me)) { S.shownPerm = null; S.roll = null; S.form = null; }
      // A typed name that isn't in the log keeps the box open by itself, so the flag is only for the empty moment.
      S.personal.me = v; S.meManual = false; savePersonal(); render(); return;
    }
    if (t.id === 'opp-pick') {
      if (t.value === OTHER) {
        Object.assign(S, { oppManual: true, opp: '', oppText: null, oppForm: blank(), oppEdited: true, oppResult: null, oppVersion: S.version, roll: null });
        render(); focusSoon('opp-name'); return;
      }
      setOpp(t.value); S.oppOpen = false; render(); return;
    }
    if (t.id === 'opp-name') {
      const v = t.value.trim();
      if (v && fullIndex().players[key(v)]) setOpp(v);
      else Object.assign(S, { opp: v, oppText: null, oppManual: true, oppEdited: true, oppVersion: S.version, roll: null, oppForm: S.oppForm || blank() });
      render(); return;
    }
    if (t.dataset && t.dataset.target && t.dataset.slot != null) {
      const d = draftOf(t.dataset.target);
      if (d) { d[+t.dataset.slot].p = t.value.trim(); afterDraft(t.dataset.target); render(); }
      return;
    }
    if (t.id === 'shown') { S.shownPerm = +t.value; S.roll = null; render(); return; }
    if (t.id === 'f-round') { form().round = t.value; return; }
    if (t.id === 'f-a-name' || t.id === 'f-b-name') { const sd = t.id.charAt(2); form()[sd].name = t.value.trim(); prefillSide(sd); render(); return; }
    if (!canAdmin() && /^set-(bonus|sigma|sims)$/.test(t.id)) { render(); return; }
    if (t.id === 'set-bonus') { const v = parseFloat(t.value); if (isFinite(v) && v >= 0 && v <= 100) { S.shared.bonus = v / 100; saveShared(); } render(); return; }
    if (t.id === 'set-sigma') { const v = parseFloat(t.value); if (isFinite(v) && v >= 0.5 && v <= 60) { S.shared.sigma = v / 100; saveShared(); } render(); return; }
    if (t.id === 'set-sims') { S.shared.sims = +t.value; saveShared(); render(); return; }
    if (t.id === 'imp') { S.importText = t.value; }
  });

  /* ---------- battle reports shipped with the page ---------- */
  async function loadBundle() {
    try {
      const r = await fetch('data/reports.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const arr = await r.json();
      S.bundle = Array.isArray(arr) ? arr.filter((b) => b && b.a && b.b) : [];
      S.bundleState = S.bundle.length ? 'ok' : 'none';
    } catch (e) { S.bundle = []; S.bundleState = 'none'; }
    bump(); render();
  }

  /* ---------- boot ---------- */
  function fromHash() { const h = (location.hash || '').slice(1); S.view = VIEWS.indexOf(h) >= 0 ? h : 'next'; }
  window.addEventListener('hashchange', () => { fromHash(); render(); });
  const HOT_KEYS = ['view', 'opp', 'oppForm', 'oppEdited', 'oppResult', 'oppManual', 'oppOpen', 'shownPerm', 'sel', 'forceReal'];
  function snapshotState() { const o = {}; HOT_KEYS.forEach((k) => { o[k] = S[k]; }); return JSON.parse(JSON.stringify(o)); }
  function start(hot) {
    if (hot && typeof hot === 'object') HOT_KEYS.forEach((k) => { if (k in hot && k !== 'view') S[k] = hot[k]; });
    fromHash(); draw(); initStore(); loadBundle();
  }
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(snapshotState); } catch (e) { /* ignore */ }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
</body>
</html>
