    const team = S.store !== 'db' ? '' : `<section class="card" aria-labelledby="h-team"><div class="card-h"><h2 id="h-team">Team</h2></div><div class="prose">

      <div class="field"><span class="lbl">Export</span>

    const how = `<section class="card" aria-labelledby="h-how"><div class="card-h"><h2 id="h-how">How the tracker works</h2></div><div class="prose">

  const VIEW = { next: viewNext, race: viewRace, standings: viewStandings, insights: viewInsights, opponents: viewOpponents, log: viewLog, patterns: viewPatterns, setup: viewSetup };

  /* ---------- actions ---------- */
  async function saveForm() {
    const f = form(), r = parseFloat(f.round), a = valid(f.a.s), b = valid(f.b.s);
    const an = (f.a.name || '').trim(), bn = (f.b.name || '').trim();
    let err = '';
    if (!isFinite(r)) err = 'Enter the round number.';
    else if (!an || !bn) err = 'Enter both player names.';
    else if (key(an) === key(bn)) err = 'The two sides need different names.';
    else if (!a || !b) err = 'Enter type and power for all six squads.';
    else if (f.win !== 'a' && f.win !== 'b') err = 'Pick who won.';
    if (err) { S.formMsg = err; render(); return; }
    const battle = { round: r, a: { name: an, s: a }, b: { name: bn, s: b }, win: f.win, note: '', created: new Date().toISOString() };
    const k = E.battleKey(battle);
    if (S.battles.some((x) => { const n = E.normBattle(x); return n && E.battleKey(n) === k; })) { S.formMsg = `Round ${r}, ${an} against ${bn}, is already logged.`; render(); return; }
    try {
      await addBattles([battle]);
      S.formMsg = `Saved round ${r}: ${an} against ${bn}.`;
      f.b = { name: '', s: blank(), touched: false }; f.win = '';
    } catch (e) { S.formMsg = errText(e); }
    render();
  }
  async function doImport() {
    let data;
    try { data = JSON.parse(S.importText); } catch (e) { S.importMsg = 'That isn’t valid JSON. Paste exactly what was exported, or what Claude gave you.'; render(); return; }
    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.battles) ? data.battles : null);
    if (!arr) { S.importMsg = 'Expected a list of battles.'; render(); return; }
    // An older copy of a fight that doesn't know its group is replaced by an imported copy that does.
    const have = new Map(), ids = new Set();
    S.battles.forEach((x) => { ids.add(x.id); const n = E.normBattle(x); if (n) have.set(E.battleKey(n), { id: x.id, g: !!n.g }); });
    S.bundle.forEach((x) => { if (x._id != null) ids.add(String(x._id)); const n = E.normBattle(x); if (n) have.set(E.battleKey(n), { id: null, g: true }); });
    const add = [], stale = []; let bad = 0, dup = 0;
    arr.forEach((raw) => {
      const n = E.normBattle(raw);
      if (!n) { bad++; return; }
      const k = E.battleKey(n), old = have.get(k), rid = raw._id != null ? String(raw._id).replace(/[^\w-]/g, '_') : '';
      if ((old && (old.g || !n.g)) || (rid && ids.has(rid))) { dup++; return; }
      if (old && old.id) stale.push(old.id);
      have.set(k, { id: rid || null, g: !!n.g });
      const doc = { round: n.round, a: n.a, b: n.b, win: n.win, note: n.note || '', created: new Date().toISOString() };
      if (n.g) doc.g = n.g;
      if (n.e) doc.e = n.e;
      if (rid) doc._id = rid;
      add.push(doc);
    });
    if (!add.length) { S.importMsg = `Nothing new to add (${dup} already logged, ${bad} unreadable).`; render(); return; }
    S.importText = ''; S.busy = 'import'; render();
    let shown = 0, removed = 0;
    try {
      await addBattles(add, (i, n) => { if (i === n || Date.now() - shown > 700) { shown = Date.now(); S.importMsg = `Saving ${i} of ${n}…`; render(); } });
      if (stale.length && canAdmin()) {
        if (S.store === 'db') { for (const id of stale) { try { await retrying(() => S.db.doc('battles/' + id).delete()); removed++; } catch (e) { /* the newer copy is used anyway */ } } }
        else { const st = new Set(stale); S.battles = S.battles.filter((x) => !st.has(x.id)); removed = stale.length; saveLocal(); }
      }
      S.importMsg = `Imported ${plural(add.length, 'battle')}${dup ? `, skipped ${dup} already logged` : ''}${removed ? `, replaced ${removed} older ${removed === 1 ? 'copy' : 'copies'}` : ''}${bad ? `, ${bad} unreadable` : ''}.`;
    } catch (e) { S.importMsg = errText(e); }
    S.busy = ''; bump(); render();
  }
  async function wipeAll() {
    S.busy = 'wipe'; render();
    try {
      if (S.store === 'db') { for (const b of S.battles.slice()) await S.db.doc('battles/' + b.id).delete(); }
      else { S.battles = []; saveLocal(); bump(); }
    } catch (e) { showErr(e); }
    S.busy = ''; S.wipe = 0; render();
  }

  document.addEventListener('click', async (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const a = el.dataset.act;
    if (a === 'real') { S.forceReal = true; location.hash = '#setup'; render(); }
    else if (a === 'dismiss') { S.note = ''; S.noteErr = false; render(); }
    else if (a === 'opp') { setOpp(el.dataset.name); S.oppOpen = false; render(); }
    else if (a === 'raceopp') { setOpp(el.dataset.name); S.oppOpen = false; if (location.hash !== '#next') location.hash = 'next'; else render(); }
    else if (a === 'stscope') { S.stScope = el.dataset.v === 'all' ? 'all' : 'seed'; render(); }
    else if (a === 'oedit') { S.oppOpen = !S.oppOpen; render(); }
    else if (a === 'melog') { S.personal.myForm = null; S.meDraft = null; S.shownPerm = null; S.roll = null; savePersonal(); render(); }
    else if (a === 'mehand') {
      const lf = myLog();
      if (lf) { S.meDraft = clone(lf.form); S.personal.myForm = valid(S.meDraft); S.shownPerm = null; S.roll = null; savePersonal(); }
      render();
    }
    else if (a === 'type') { const d = draftOf(el.dataset.target); if (d) { d[+el.dataset.slot].t = el.dataset.t; afterDraft(el.dataset.target); render(); } }
    else if (a === 'ores') { S.oppResult = el.dataset.v || null; S.roll = null; render(); }
    else if (a === 'oreset') { setOpp(S.opp); S.oppOpen = false; render(); }
    else if (a === 'roll') {
      const mf = myForm(), of = valid(S.oppForm);
      if (!mf || !of) return;
      const mc = E.canonical(mf).canon, ds = defaultShown(mf);
      const pr = E.predict(model(), { opp: S.opp, oppForm: S.oppEdited ? of : null, oppLastResult: S.oppResult, myForm: mf, myShown: E.orderSquads(mc, S.shownPerm != null ? S.shownPerm : ds.k) });
      const x = Math.random(); let s = 0, pick = 5;
      for (let k = 0; k < 6; k++) { s += pr.nash.row[k]; if (x <= s) { pick = k; break; } }
      S.roll = pick; render();
    }
    else if (a === 'sel') { S.sel = el.dataset.k; render(); }
    else if (a === 'scout') { setOpp(el.dataset.name); S.oppOpen = false; location.hash = '#next'; render(); }
    else if (a === 'fwin') { form().win = el.dataset.v; render(); }
    else if (a === 'fsave') { saveForm(); }
    else if (a === 'askdel') { S.confirm = el.dataset.id; render(); }
    else if (a === 'nodel') { S.confirm = null; render(); }
    else if (a === 'del') { const id = el.dataset.id; S.confirm = null; try { await deleteBattle(id); } catch (e) { showErr(e); } render(); }
    else if (a === 'all') { S.showAll = true; render(); }
    else if (a === 'logall') { S.logAll = !S.logAll; S.showAll = false; render(); }
    else if (a === 'cal') {
      S.busy = 'cal'; render();
      setTimeout(() => { try { S.cal = E.calibrate(battles(), settings()); } catch (e) { S.cal = null; } S.busy = ''; render(); }, 40);
    }
    else if (a === 'calapply' && S.cal && canAdmin()) { S.shared.bonus = S.cal.best.bonus; S.shared.sigma = S.cal.best.sigma; if (S.cal.best.attr) S.shared.attr = S.cal.best.attr; saveShared(); render(); }
    else if (a === 'copy') {
      try { await navigator.clipboard.writeText(exportJSON()); S.copyMsg = 'Copied.'; render(); }
      catch (e) {
        S.showExport = true; S.copyMsg = 'Copying was blocked. The text is selected, so copy it yourself.'; render();
        setTimeout(() => { const t = document.getElementById('exp'); if (t) { t.focus(); t.select(); } }, 80);
      }
    }
    else if (a === 'import') { doImport(); }
    else if (a === 'showexp') { S.showExport = true; render(); }
    else if (a === 'wipe1') { S.wipe = 1; render(); }
    else if (a === 'wipe0') { S.wipe = 0; render(); }
    else if (a === 'wipe2' && canAdmin()) { wipeAll(); }
  });

  const isPick = (ev) => ev.inputType === 'insertReplacementText' || ev.inputType == null;
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset && t.dataset.target && t.dataset.slot != null) { const d = draftOf(t.dataset.target); if (d) d[+t.dataset.slot].p = t.value; return; }
    if (t.id === 'st-find') { S.stFind = t.value; render(); return; }
    if (t.id === 'opp-name') {
      S.oppText = t.value;
      if (isPick(ev) && fullIndex().players[key(t.value)]) { setOpp(t.value); render(); }
      return;
    }
    if (t.id === 'f-round') { form().round = t.value; return; }
    if (t.id === 'f-a-name' || t.id === 'f-b-name') {
      const sd = t.id.charAt(2); form()[sd].name = t.value;
      if (isPick(ev) && fullIndex().players[key(t.value)]) { prefillSide(sd); render(); }
      return;
    }
    if (t.id === 'me-name') { S.meText = t.value; return; }
    if (t.id === 'imp') { S.importText = t.value; }
  });
  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.id === 'ins-pick') { S.insFor = t.value; render(); return; }
    if (t.id === 'st-group') { S.stGroup = t.value; render(); return; }
    if (t.id === 'me-pick' || t.id === 'set-me') {
      if (t.value === OTHER) { S.meManual = true; S.meText = null; render(); focusSoon('me-name'); return; }
      pickMe(t.value); return;
    }
    if (t.id === 'me-name') {
      const v = t.value.trim(); S.meText = null;
      if (v && fullIndex().players[key(v)]) { pickMe(v); return; }
      if (key(v) !== key(baseSettings().me)) { S.shownPerm = null; S.roll = null; S.form = null; }
      // A typed name that isn't in the log keeps the box open by itself, so the flag is only for the empty moment.
      S.personal.me = v; S.meManual = false; savePersonal(); render(); return;
    }
    if (t.id === 'opp-pick') {
      if (t.value === OTHER) {
        Object.assign(S, { oppManual: true, opp: '', oppText: null, oppForm: blank(), oppEdited: true, oppResult: null, oppVersion: S.version, roll: null });
        render(); focusSoon('opp-name'); return;
      }
      setOpp(t.value); S.oppOpen = false; render(); return;
    }
    if (t.id === 'opp-name') {
      const v = t.value.trim();
      if (v && fullIndex().players[key(v)]) setOpp(v);
      else Object.assign(S, { opp: v, oppText: null, oppManual: true, oppEdited: true, oppVersion: S.version, roll: null, oppForm: S.oppForm || blank() });
      render(); return;
    }
    if (t.dataset && t.dataset.target && t.dataset.slot != null) {
      const d = draftOf(t.dataset.target);
      if (d) { d[+t.dataset.slot].p = t.value.trim(); afterDraft(t.dataset.target); render(); }
      return;
    }
    if (t.id === 'shown') { S.shownPerm = +t.value; S.roll = null; render(); return; }
    if (t.id === 'f-round') { form().round = t.value; return; }
    if (t.id === 'f-a-name' || t.id === 'f-b-name') { const sd = t.id.charAt(2); form()[sd].name = t.value.trim(); prefillSide(sd); render(); return; }
    if (!canAdmin() && /^set-(bonus|sigma|sims)$/.test(t.id)) { render(); return; }
    if (t.id === 'set-bonus') { const v = parseFloat(t.value); if (isFinite(v) && v >= 0 && v <= 100) { S.shared.bonus = v / 100; saveShared(); } render(); return; }
    if (t.id === 'set-sigma') { const v = parseFloat(t.value); if (isFinite(v) && v >= 0.5 && v <= 60) { S.shared.sigma = v / 100; saveShared(); } render(); return; }
    if (t.id === 'set-sims') { S.shared.sims = +t.value; saveShared(); render(); return; }
    if (t.id === 'imp') { S.importText = t.value; }
  });

  /* ---------- battle reports shipped with the page ---------- */
  async function loadBundle() {
    try {
      // The password-protected website carries the reports inside the unlocked page itself.
      const inline = document.getElementById('bundled-reports');
      let arr;
      if (inline) arr = JSON.parse(inline.textContent);
      else {
        const r = await fetch('data/reports.json', { cache: 'no-cache' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        arr = await r.json();
      }
      S.bundle = Array.isArray(arr) ? arr.filter((b) => b && b.a && b.b) : [];
      S.bundleState = S.bundle.length ? 'ok' : 'none';
    } catch (e) { S.bundle = []; S.bundleState = 'none'; }
    bump(); render();
    loadRace();
  }

  /* ---------- boot ---------- */
  // Password-protected website only: the unlock page defines lwduelLogout.
  (function () {
    const b = document.getElementById('logout');
    if (b && typeof window.lwduelLogout === 'function') { b.hidden = false; b.addEventListener('click', () => window.lwduelLogout()); }
  })();
  function fromHash() { const h = (location.hash || '').slice(1); S.view = VIEWS.indexOf(h) >= 0 ? h : 'next'; }
  window.addEventListener('hashchange', () => { fromHash(); render(); });
  const HOT_KEYS = ['view', 'opp', 'oppForm', 'oppEdited', 'oppResult', 'oppManual', 'oppOpen', 'shownPerm', 'sel', 'forceReal'];
  function snapshotState() { const o = {}; HOT_KEYS.forEach((k) => { o[k] = S[k]; }); return JSON.parse(JSON.stringify(o)); }
  function start(hot) {
    if (hot && typeof hot === 'object') HOT_KEYS.forEach((k) => { if (k in hot && k !== 'view') S[k] = hot[k]; });
    fromHash(); draw(); initStore(); loadBundle();
  }
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(snapshotState); } catch (e) { /* ignore */ }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
