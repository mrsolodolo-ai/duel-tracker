<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last War Duel Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  /* Layout: a field-scouting sheet. Tab rail on top; on Next fight the call leads and the evidence follows. */
  --bg: #e6e4da;
  --panel: #f6f5ef;
  --field: #fffefa;
  --ink: #1b1f21;
  --muted: #59605b;
  --line: #cfcbbe;
  --accent: #4b5a1a;
  --accent-ink: #f7f6ee;
  --tank: #b04f26;
  --air: #2a69a6;
  --msl: #876707;
  --mix: #686c6f;
  --chip-ink: #ffffff;
  --win: #2b7743;
  --loss: #a3323d;
  --display: 'Big Shoulders Stencil Display', 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --cond: 'Barlow Semi Condensed', 'Barlow', 'Arial Narrow', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --panel: #1a1f22; --field: #13171a; --ink: #e8e6dd; --muted: #9ca29d; --line: #2e363a;
    --accent: #b5c66c; --accent-ink: #15190a; --tank: #e3814f; --air: #66a9ea; --msl: #ddb440; --mix: #a2a6a9;
    --chip-ink: #111416; --win: #62c283; --loss: #e8717e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --panel: #1a1f22; --field: #13171a; --ink: #e8e6dd; --muted: #9ca29d; --line: #2e363a;
  --accent: #b5c66c; --accent-ink: #15190a; --tank: #e3814f; --air: #66a9ea; --msl: #ddb440; --mix: #a2a6a9;
  --chip-ink: #111416; --win: #62c283; --loss: #e8717e; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td, .pct { font-variant-numeric: tabular-nums; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 20px 0 10px; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: .95; letter-spacing: .02em; text-transform: uppercase; }
.brand .sub { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.status { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); white-space: nowrap; }
.status.ok { color: var(--win); border-color: color-mix(in oklab, var(--win) 40%, var(--line)); }
.status.warn { color: var(--msl); border-color: color-mix(in oklab, var(--msl) 45%, var(--line)); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
.tabs a { font-family: var(--cond); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; color: var(--muted); padding: 10px 12px 9px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

.note { border: 1px solid var(--line); border-left: 4px solid var(--msl); background: var(--panel); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.note.err { border-left-color: var(--loss); }
.note p { max-width: 70ch; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-h h2 { font-family: var(--cond); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.card-h .aside { font-size: 13px; color: var(--muted); }
.lbl { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.hint { text-transform: none; letter-spacing: 0; font-family: var(--body); font-weight: 400; }
.meta { font-size: 13px; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.quick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.quick .btn { flex: none; }
.quick.flow { flex-wrap: wrap; overflow: visible; }

input[type="text"], input:not([type]), select, textarea { background: var(--field); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; min-height: 120px; resize: vertical; }
select { appearance: auto; }
select.pick { font-size: 16px; font-weight: 600; padding: 10px 12px; }
.vsd { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.vsd::before, .vsd::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
.btn .rec { font-family: var(--body); font-weight: 500; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

.btn { border: 1px solid var(--line); background: var(--field); border-radius: 7px; padding: 8px 14px; font-family: var(--cond); font-weight: 700; letter-spacing: .04em; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--loss); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--field); }
.seg button { border: 0; background: transparent; padding: 6px 9px; font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: .05em; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg button.t-T[aria-pressed="true"] { background: var(--tank); color: var(--chip-ink); }
.seg button.t-A[aria-pressed="true"] { background: var(--air); color: var(--chip-ink); }
.seg button.t-M[aria-pressed="true"] { background: var(--msl); color: var(--chip-ink); }
.seg button.t-X[aria-pressed="true"] { background: var(--mix); color: var(--chip-ink); }

.slot { display: grid; grid-template-columns: 22px auto minmax(70px, 1fr); gap: 8px; align-items: center; }
.slot-n { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--muted); text-align: center; }
.slot input { text-align: right; font-variant-numeric: tabular-nums; }

/* squads */
.chip { --c: var(--mix); display: inline-flex; align-items: stretch; border-radius: 6px; border: 1px solid color-mix(in oklab, var(--c) 50%, transparent); background: color-mix(in oklab, var(--c) 13%, var(--panel)); overflow: hidden; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip b { background: var(--c); color: var(--chip-ink); font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .06em; padding: 2px 6px; display: flex; align-items: center; }
.chip span { padding: 2px 7px; font-weight: 600; font-size: 13px; }
.t-T { --c: var(--tank); } .t-A { --c: var(--air); } .t-M { --c: var(--msl); } .t-X { --c: var(--mix); }
.order { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.order .arr { width: 10px; height: 10px; border-top: 2px solid var(--muted); border-right: 2px solid var(--muted); transform: rotate(45deg) scale(.6); flex: none; }
.order.big { gap: 6px; }
.order.big .chip b { font-size: 15px; padding: 6px 9px; }
.order.big .chip span { font-size: 18px; padding: 5px 10px; }
.minis { display: inline-flex; gap: 2px; }
.mini { --c: var(--mix); display: inline-block; width: 18px; height: 18px; border-radius: 4px; background: var(--c); color: var(--chip-ink); font-family: var(--cond); font-weight: 700; font-size: 11px; line-height: 18px; text-align: center; }

/* next fight */
.grid-next { display: grid; grid-template-columns: minmax(290px, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.hero { border-left: 5px solid var(--accent); }
.stamp { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 2px solid currentColor; border-radius: 4px; padding: 1px 7px; transform: rotate(-2deg); display: inline-block; }
.big-num { font-family: var(--display); font-weight: 800; font-size: 56px; line-height: .9; letter-spacing: .01em; }
.big-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.big-row .cap { color: var(--muted); max-width: 32ch; padding-bottom: 6px; }
.callout { font-size: 14px; }
.foot { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }

.prow { display: grid; grid-template-columns: minmax(0, auto) minmax(60px, 1fr) 46px; gap: 10px; align-items: center; padding: 4px 0; }
.prow.top { font-weight: 700; }
.prow .pct { text-align: right; font-weight: 600; }
.bar { height: 8px; background: color-mix(in oklab, var(--line) 70%, transparent); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar.muted i { background: var(--muted); }
.tag { font-family: var(--cond); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
.tag.hot { color: var(--accent); border-color: var(--accent); }
.lead { font-size: 16px; }
.rematch { border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 12px; background: color-mix(in oklab, var(--accent) 7%, var(--panel)); display: flex; flex-direction: column; gap: 6px; }
.rematch .tag { margin-left: 0; margin-right: 6px; }

.tend { display: grid; grid-template-columns: minmax(130px, 210px) minmax(60px, 1fr) 42px; gap: 10px; align-items: center; font-size: 14px; }
.tend .pct { text-align: right; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scroll { overflow-x: auto; }
.mx td.cell { text-align: center; font-weight: 600; min-width: 52px; }
.mx th .p { display: block; font-family: var(--body); letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--ink); }
details > summary { cursor: pointer; font-family: var(--cond); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
details[open] > summary { margin-bottom: 10px; }

.pill { font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .06em; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.w { color: var(--win); } .pill.l { color: var(--loss); }
.ok { color: var(--win); } .bad { color: var(--loss); }

/* opponents */
.grid-opp { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
.plist { display: flex; flex-direction: column; gap: 2px; max-height: 70vh; overflow: auto; }
.plist button { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; gap: 4px; }
.plist button:hover { background: var(--field); }
.plist button[aria-current="true"] { background: var(--field); border-color: var(--accent); }
.plist .nm { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }

/* log */
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.side { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--field); }
.side.won { border-color: var(--win); box-shadow: inset 0 0 0 1px var(--win); }
.blist .b { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.blist .vs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.blist .who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.blist .rd { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--muted); }
.blist .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.stat { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.stat b { font-variant-numeric: tabular-nums; }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.empty { color: var(--muted); padding: 18px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; }

@media (max-width: 820px) {
  .grid-next { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .grid-next .col { display: contents; }
  .c-opp { order: 1; } .c-hero { order: 2; } .c-pred { order: 3; } .c-you { order: 4; } .c-mix { order: 5; } .c-mx { order: 6; }
  .grid-opp, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .plist { max-height: 260px; }
  .sides { grid-template-columns: minmax(0, 1fr); }
  .big-num { font-size: 48px; }
  .three { grid-template-columns: minmax(0, 1fr); }
  .tabs a { font-size: 14px; padding: 9px 9px 8px; }
  /* 16px stops phones zooming in when a field is tapped */
  input[type="text"], input:not([type]), select, textarea { font-size: 16px; }
}
@media (max-width: 420px) {
  .brand h1 { font-size: 28px; }
  .tend { grid-template-columns: minmax(110px, 1fr) 70px 40px; }
  .prow { grid-template-columns: minmax(0, auto) 50px 42px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .35s ease; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Duel Tracker</h1>
      <span class="sub">Last War · Champion Duel qualifier scouting</span>
    </div>
    <span id="status" class="status" role="status">Connecting…</span>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#next" data-view="next">Next fight</a>
    <a href="#opponents" data-view="opponents">Opponents</a>
    <a href="#log" data-view="log">Battle log</a>
    <a href="#patterns" data-view="patterns">Patterns</a>
    <a href="#setup" data-view="setup">Setup</a>
  </nav>
  <div id="notes"></div>
  <main id="view"></main>
  <datalist id="dl-players"></datalist>
  <datalist id="dl-all"></datalist>
</div>
<script>
/* Champion Duel engine: fight simulator, opponent behavior model, recommender.
   Works in the browser (window.DuelEngine) and in Node (module.exports). */
(function (root) {
  'use strict';

  var TYPES = ['T', 'A', 'M', 'X'];
  var TYPE_NAME = { T: 'Tank', A: 'Aircraft', M: 'Missile', X: 'Mixed' };
  var BEATS = { T: 'M', M: 'A', A: 'T' }; // key beats value
  var PERMS = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
  var EXPERTS = ['habit', 'strongest', 'counter', 'wsls', 'double', 'random'];
  var EXPERT_INFO = {
    habit: { label: 'Creature of habit', blurb: 'Plays the order they used most recently.' },
    strongest: { label: 'Strongest squad first', blurb: 'Leads with their highest-power squad, as most guides advise.' },
    counter: { label: 'Counters what they see', blurb: "Picks the order that beats their opponent's last formation." },
    wsls: { label: 'Keeps a win, changes a loss', blurb: 'Same order after a win; something different after a loss.' },
    double: { label: 'Second-guesser', blurb: 'Expects to be countered, so counters the counter.' },
    random: { label: 'Unpredictable', blurb: 'No pattern the model can find.' }
  };
  var REMATCH_INFO = { label: 'Remembers your last meeting', blurb: 'In a rematch, replays the order that beat you, or counters the order that beat them.' };
  var RM_PRIOR = { a: 1, b: 2 }; // weak prior: about a third of rematch choices follow the last meeting
  var DEFAULT_W = { habit: 0.40, strongest: 0.15, counter: 0.15, wsls: 0.12, double: 0.06, random: 0.12 };
  var DEFAULTS = {
    bonus: 0.04,     // counter edge on hero power when a squad's type beats the enemy's (fitted on 391 real encounters)
    sigma: 0.03,     // spread of hidden strength around listed power (lognormal sd, per squad; fitted)
    attr: 1.5,       // attrition exponent: how many troops a winner keeps (fitted on real survivor counts)
    sims: 1500,      // simulations for the live matchup
    fitSims: 120,    // simulations per matchup when learning from history
    decay: 0.5,      // how fast older formations fade from a player's habit
    prior: 3,        // how many fights of evidence the population pattern is worth for one player
    popPrior: 2,     // pseudo-fights behind the default pattern for the population
    tie: 0.015       // win-chance gap treated as a tie when finding best responses
  };

  /* ---------- small helpers ---------- */
  function uniform6() { return [1 / 6, 1 / 6, 1 / 6, 1 / 6, 1 / 6, 1 / 6]; }
  function onehot(k) { var a = [0, 0, 0, 0, 0, 0]; a[k] = 1; return a; }
  function normalizeArr(a) {
    var s = 0, i;
    for (i = 0; i < a.length; i++) s += a[i];
    if (!(s > 0)) return a.map(function () { return 1 / a.length; });
    return a.map(function (v) { return v / s; });
  }
  function normalizeObj(o) {
    var s = 0, k, out = {};
    for (k in o) s += o[k];
    for (k in o) out[k] = s > 0 ? o[k] / s : 1 / Object.keys(o).length;
    return out;
  }
  function scaleObj(o, f) { var out = {}; for (var k in o) out[k] = o[k] * f; return out; }
  function argmax(a) { var b = 0; for (var i = 1; i < a.length; i++) if (a[i] > a[b]) b = i; return b; }
  function keyOf(name) { return String(name || '').trim().toLowerCase(); }

  function normType(t) {
    var s = String(t || '').trim().toUpperCase();
    if (s.indexOf('MIX') === 0 || s === 'X') return 'X';
    if (s.charAt(0) === 'T') return 'T';
    if (s.charAt(0) === 'A' || s.indexOf('AIR') >= 0 || s.indexOf('PLANE') >= 0) return 'A';
    if (s.charAt(0) === 'M' || s.indexOf('MISS') >= 0 || s.indexOf('ROCK') >= 0) return 'M';
    return 'X';
  }
  function normPower(p) {
    var v;
    if (typeof p === 'number') v = p;
    else {
      var s = String(p == null ? '' : p).trim().replace(/[,\s]/g, '');
      var mult = 1;
      if (/k$/i.test(s)) { mult = 0.001; s = s.slice(0, -1); }
      else if (/m$/i.test(s)) { s = s.slice(0, -1); }
      else if (/b$/i.test(s)) { mult = 1000; s = s.slice(0, -1); }
      v = parseFloat(s) * mult;
    }
    if (!isFinite(v) || v <= 0) return NaN;
    if (v > 10000) v = v / 1e6; // raw numbers like 48,200,000 become millions
    return Math.round(v * 100) / 100;
  }
  function normSquads(arr) {
    if (!Array.isArray(arr) || arr.length !== 3) return null;
    var out = arr.map(function (q) {
      var o = { t: normType(q && (q.t || q.type)), p: normPower(q && (q.p != null ? q.p : q.power)) };
      if (q && q.id != null && q.id !== '') o.id = String(q.id);
      return o;
    });
    for (var i = 0; i < 3; i++) if (!isFinite(out[i].p)) return null;
    return out;
  }
  // Optional per-side details from imported reports: alliance tag and server.
  function sideOf(x, name, squads) {
    var o = { name: name, s: squads };
    if (x.al != null && String(x.al).trim()) o.al = String(x.al).trim();
    if (x.sv != null && isFinite(+x.sv)) o.sv = +x.sv;
    return o;
  }

  }
  const topTendency = (w) => E.EXPERTS.slice().sort((a, b) => w[b] - w[a])[0];

  /* ---------- name pickers ---------- */
  function myLog() {
    const m = model(), me = m.index.players[m.meKey];
    return me && me.entries.length ? me.entries[me.entries.length - 1] : null;
  }
  // Pairings go by record, so players whose record matches yours are the likeliest next opponents.
  // Only players with a fight logged in every round have a record that can be trusted.
  function likelyOpps() {
    const m = model(), me = m.index.players[m.meKey];
    if (!me) return [];
    const nR = new Set(m.index.battles.map((b) => b.round)).size;
    const full = (p) => new Set(p.entries.map((e) => e.round)).size === nR;
    if (!full(me)) return [];
    const wins = (p) => p.entries.filter((e) => e.won).length, mw = wins(me);
    return Object.values(m.index.players).filter((p) => p.key !== me.key && full(p))
      .map((p) => { const w = wins(p); return { name: p.name, w, l: p.entries.length - w, d: Math.abs(w - mw) }; })
      .filter((x) => x.d <= 1)

  const option = (v, label, sel, dis) => `<option value="${esc(v)}"${sel ? ' selected' : ''}${dis ? ' disabled' : ''}>${esc(label)}</option>`;
  // Players from other alliances who are listed in the "your alliance" section too.
  const EXTRA_MATES = ['Ali ᚢ'];
  // Your alliance: the tracker owner's tag, or your own once you have picked your name.
  function teamAlliance() {
    const P = fullIndex().players, o = P[key(S.shared.me)] || P[key(settings().me)];

  }
  const SELC = {};
  function memoSel(id, k, build) { const c = SELC[id]; if (c && c.k === k) return c.html; const html = build(); SELC[id] = { k, html }; return html; }
  function meSelect(id) {
    const dm = isDemo(), me = settings().me, meK = key(me);

    if (dm && id === 'set-me') return `<input id="me-name" type="text" autocomplete="off" spellcheck="false" value="${esc(S.meText != null ? S.meText : baseSettings().me)}" placeholder="Exactly as it appears in battle reports">`;
    const P = fullIndex().players, inLog = !!(me && P[meK]);
    const manual = !dm && (S.meManual || (!!me && !inLog));
    const team = teamAlliance();
    const opts = memoSel(id, [FIK, meK, inLog, manual, team].join('|'), () => {
      const G = groupInfo(), many = G.roots.length > 1;
      let done = false;
      const opt = (p, label) => { const sel = !done && !manual && inLog && p.key === meK; if (sel) done = true; return option(p.name, label || p.name, sel); };
      const sorted = (ps) => ps.sort((x, y) => byName(x.name, y.name));
      const all = Object.values(P);
      let o = option('', 'Pick your name', !inLog || manual, true);

      if (mates.length) o += `<optgroup label="${esc(team)} · your alliance">${mates.map((p) => opt(p, many && G.label[G.comp[p.key]] ? `${p.name} · ${G.label[G.comp[p.key]]}` : p.name)).join('')}</optgroup>`;
      if (many) G.roots.forEach((r) => { o += `<optgroup label="${esc(groupName(G, r))}">${sorted(all.filter((p) => G.comp[p.key] === r)).map((p) => opt(p)).join('')}</optgroup>`; });
      else o += (mates.length ? '<optgroup label="Everyone">' : '') + sorted(all).map((p) => opt(p)).join('') + (mates.length ? '</optgroup>' : '');
      if (!dm) o += option(OTHER, 'I’m not on this list', manual);
      return o;
    });
    return `<select id="${id}" class="pick"${dm ? ' disabled' : ''}>${opts}</select>` +
      (manual ? `<input id="me-name" type="text" autocomplete="off" spellcheck="false" value="${esc(S.meText != null ? S.meText : me)}" placeholder="Your name, exactly as in battle reports" aria-label="Your name in the duel">` : '');
  }
  // Players who used the same order in every logged fight (3 or more fights).
  let NM = null, NMK = '';
  function neverMovers() {
    const P = fullIndex().players;
    if (NM && NMK === FIK) return NM;
    NM = new Set(); NMK = FIK;
    Object.values(P).forEach((p) => {
      if (p.entries.length < 3) return;
      const canon = E.canonical(p.entries[p.entries.length - 1].form).canon;
      if (new Set(p.entries.map((e) => E.matchPerm(e.form, canon))).size === 1) NM.add(p.key);

  }
  function oppSelect() {
    const P = fullIndex().players, meK = key(settings().me), sk = key(S.opp);
    const inLog = !!(S.opp && P[sk]);
    const manual = S.oppManual || (!!S.opp && !inLog);
    const opts = memoSel('opp-pick', [FIK, meK, sk, inLog, manual].join('|'), () => {
      const G = groupInfo(), mine = P[meK] ? G.comp[meK] : null;
      const all = Object.values(P).filter((p) => p.key !== meK);
      const list = (ps) => ps.sort((x, y) => byName(x.name, y.name)).map((p) => option(p.name, p.name, !manual && inLog && p.key === sk)).join('');
      let o = option('', 'Pick your opponent', !inLog || manual, true);
      // Never change their lineup: your group only (all groups if you haven't picked your name).
      const nm = neverMovers(), many = G.roots.length > 1;
      const steady = all.filter((p) => nm.has(p.key) && (!mine || !many || G.comp[p.key] === mine)).sort((x, y) => byName(x.name, y.name));
      if (steady.length) {

      }

      (manual ? `<input id="opp-name" type="text" list="dl-players" autocomplete="off" spellcheck="false" placeholder="Their name in the duel" aria-label="Opponent's name" value="${esc(S.oppText != null ? S.oppText : S.opp)}">` : '');
  }
  function pickMe(name) {

    S.personal.me = n; S.meManual = false; S.meText = null; S.shownPerm = null; S.roll = null; S.form = null;

  function focusSoon(id) { setTimeout(() => { const el = document.getElementById(id); if (el) el.focus(); }, 80); }

  /* ---------- opponent under scouting ---------- */
  function setOpp(name) {

    const m = model(), pl = S.opp ? m.index.players[key(S.opp)] : null;
    const last = pl ? pl.entries[pl.entries.length - 1] : null;
    if (pl) S.oppManual = false;
    S.oppForm = last ? clone(last.form) : blank();
    S.oppEdited = !last;
    S.oppResult = last ? (last.won ? 'W' : 'L') : null;
    S.oppVersion = S.version;
  }
  function draftOf(target) {
    if (target === 'opp') return S.oppForm || (S.oppForm = blank());
    if (target === 'me') return S.meDraft || (S.meDraft = S.personal.myForm ? clone(S.personal.myForm) : blank());
    if (target === 'a' || target === 'b') return form()[target].s;
    return null;
  }
  function afterDraft(target) {
    if (target === 'opp') {
      const m = model(), pl = m.index.players[key(S.opp)], last = pl && pl.entries[pl.entries.length - 1];
      const v = valid(S.oppForm);
      S.oppEdited = !last || !v || !E.sameForm(v, last.form);
      S.roll = null;
    } else if (target === 'me') {
      const v = valid(S.meDraft);
      if (v) { S.personal.myForm = v; S.roll = null; S.shownPerm = null; savePersonal(); }
    } else if (target === 'a' || target === 'b') {
      form()[target].touched = true;
    }
  }

  /* ---------- storage ---------- */
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS);
      if (raw) {
        const o = JSON.parse(raw), st = o.shared || o.settings || {};
        S.battles = Array.isArray(o.battles) ? o.battles : [];
        S.shared = Object.assign({}, DEF_SHARED, st);
        S.personal = Object.assign({}, DEF_PERSONAL, o.personal || { me: st.me || '', myForm: st.myForm || null });
      }
    } catch (e) { /* storage unavailable in this view */ }
  }
  function saveLocal() {
    try { localStorage.setItem(LS, JSON.stringify({ battles: S.battles, shared: S.shared, personal: S.personal })); } catch (e) { /* ignore */ }
  }
  function loadPersonalLocal() { try { const raw = localStorage.getItem(LS_ME); if (raw) S.personal = Object.assign({}, DEF_PERSONAL, JSON.parse(raw)); } catch (e) { /* ignore */ } }
  function savePersonalLocal() { try { localStorage.setItem(LS_ME, JSON.stringify(S.personal)); } catch (e) { /* ignore */ } }
  function errText(e) {
    const c = e && e.code;
    if (c === 'quota_exceeded') return 'The tracker is full. Delete old battles to add new ones.';
    if (c === 'invalid_argument') return 'You can view this tracker but not change it.';
    if (c === 'resource_exhausted') return 'Too many changes at once. Wait a few seconds and try again.';
    if (c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Saving is off in this view.';
    return 'Couldn’t save just now. Try again in a moment.';
  }
  function showErr(e) { S.note = errText(e); S.noteErr = true; render(); }

  let setT = 0, setBusy = false, setAgain = false;
  function saveShared() { clearTimeout(setT); setT = setTimeout(flushShared, 400); }
  async function flushShared() {
    if (S.store !== 'db') { saveLocal(); return; }
    if (setBusy) { setAgain = true; return; }
    setBusy = true;
    try { await S.db.doc('meta/settings').set(JSON.parse(JSON.stringify(S.shared))); } catch (e) { showErr(e); }
    setBusy = false;
    if (setAgain) { setAgain = false; flushShared(); }
  }
  // Each viewer's own name and squads live in their private subtree, so teammates never overwrite each other.
  let perT = 0, perBusy = false, perAgain = false;
  function savePersonal() { clearTimeout(perT); perT = setTimeout(flushPersonal, 400); }
  async function flushPersonal() {
    if (S.store !== 'db') { saveLocal(); return; }
    if (S.personalStore !== 'db') { savePersonalLocal(); return; }
    if (perBusy) { perAgain = true; return; }
    perBusy = true;
    try { await S.db.doc('data/users/' + S.uid + '/settings').set(JSON.parse(JSON.stringify(S.personal))); }
    catch (e) { S.personalStore = 'local'; savePersonalLocal(); S.note = 'Your name and squads are saved in this browser only.'; S.noteErr = false; render(); }
    perBusy = false;
    if (perAgain) { perAgain = false; flushPersonal(); }
  }
  // A write the server is too busy for is retried a few times before giving up.
  async function retrying(fn) {
    for (let i = 0; ; i++) {
      try { return await fn(); }
      catch (e) { if (e && e.code === 'resource_exhausted' && i < 6) { await new Promise((r) => setTimeout(r, 1500 * (i + 1))); continue; } throw e; }
    }
  }
  // Imported reports carry their own id (_id), so importing them again never makes copies.
  async function addBattles(list, onProgress) {
    if (S.store === 'db') {
      for (let i = 0; i < list.length; i++) {
        const b = Object.assign({}, list[i]), id = b._id;
        delete b._id;
        await retrying(() => (id ? S.db.doc('battles/' + id).set(b) : S.db.collection('battles').add(b)));
        if (onProgress) onProgress(i + 1, list.length);
        if (list.length > 5) await new Promise((r) => setTimeout(r, 25));
      }
    } else {
      list.forEach((x) => { const b = Object.assign({}, x), id = b._id; delete b._id; S.battles.push(Object.assign({ id: id || 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) }, b)); });
      saveLocal(); bump();
    }
  }
  async function deleteBattle(id) {

  }
  async function initStore() {
    let db = null, user = null;
    const use = (n) => (window.claude && typeof window.claude.use === 'function' ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null));

        if (!snap.metadata.fromCache && !S.loaded) {

          if (S.noteErr && /reached/.test(S.note)) { S.note = ''; S.noteErr = false; }
        }
        bump(); render();
      }, (e) => { clearTimeout(timer); S.loaded = true; S.note = errText(e); S.noteErr = true; render(); });
      db.doc('meta/settings').onSnapshot((snap) => {
        if (!snap.exists) return;
        S.shared = Object.assign({}, DEF_SHARED, snap.data());

      }, () => {});
      if (S.uid && S.canWrite !== false) {

  /* ---------- rendering ---------- */
  let raf = 0;

  function draw() {
    const ae = document.activeElement, fid = ae && ae.id ? ae.id : null;

  let DLK = '';

    else if (S.store === 'local') { if (S.standalone) { txt = 'Your picks save on this device'; cls += ' ok'; } else { txt = 'Saving in this browser only'; cls += ' warn'; } }
    st.textContent = txt; st.className = cls;

    if (S.note) notes += `<div class="note${S.noteErr ? ' err' : ''}"><p>${esc(S.note)}</p><button class="btn small" data-act="dismiss">Dismiss</button></div>`;
    document.getElementById('notes').innerHTML = notes;
    // Typing suggestions for the free-text name boxes; rebuilt only when the log changes.
    const P = fullIndex().players, dk = FIK + '|' + key(settings().me);
    if (DLK !== dk) {
