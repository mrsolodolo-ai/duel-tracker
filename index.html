<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last War Duel Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  /* Layout: a field-scouting sheet. Tab rail on top; on Next fight the call leads and the evidence follows. */
  --bg: #e6e4da;
  --panel: #f6f5ef;
  --field: #fffefa;
  --ink: #1b1f21;
  --muted: #59605b;
  --line: #cfcbbe;
  --accent: #4b5a1a;
  --accent-ink: #f7f6ee;
  --tank: #b04f26;
  --air: #2a69a6;
  --msl: #876707;
  --mix: #686c6f;
  --chip-ink: #ffffff;
  --win: #2b7743;
  --loss: #a3323d;
  --display: 'Big Shoulders Stencil Display', 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --cond: 'Barlow Semi Condensed', 'Barlow', 'Arial Narrow', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --panel: #1a1f22; --field: #13171a; --ink: #e8e6dd; --muted: #9ca29d; --line: #2e363a;
    --accent: #b5c66c; --accent-ink: #15190a; --tank: #e3814f; --air: #66a9ea; --msl: #ddb440; --mix: #a2a6a9;
    --chip-ink: #111416; --win: #62c283; --loss: #e8717e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --panel: #1a1f22; --field: #13171a; --ink: #e8e6dd; --muted: #9ca29d; --line: #2e363a;
  --accent: #b5c66c; --accent-ink: #15190a; --tank: #e3814f; --air: #66a9ea; --msl: #ddb440; --mix: #a2a6a9;
  --chip-ink: #111416; --win: #62c283; --loss: #e8717e; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td, .pct { font-variant-numeric: tabular-nums; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 20px 0 10px; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: .95; letter-spacing: .02em; text-transform: uppercase; }
.brand .sub { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.status { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); white-space: nowrap; }
.top-right { display: flex; align-items: center; gap: 10px; }
.logout { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .04em; background: none; border: 0; padding: 4px 2px; color: var(--muted); text-decoration: underline; cursor: pointer; }
.logout:hover { color: var(--ink); }
tr.best td { font-weight: 700; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-radius: 8px; background: color-mix(in oklab, var(--accent) 9%, var(--panel)); border: 1px solid color-mix(in oklab, var(--accent) 40%, var(--line)); }
.fact { font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: .02em; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--field); color: var(--ink); }
.fact.hot { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tip { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; display: flex; flex-direction: column; gap: 2px; }
.tip.hot { border-left-color: var(--loss); }
.tip h3 { font-size: 15px; font-weight: 700; margin: 0; }
.tip p { margin: 0; font-size: 14px; }
table.race tr.me td { background: color-mix(in oklab, var(--accent) 14%, transparent); font-weight: 700; }
table.race-opps tr.key td { background: color-mix(in oklab, var(--msl) 10%, transparent); }
.racebar { display: flex; align-items: center; gap: 6px; min-width: 92px; }
.racebar .bar { flex: 1; min-width: 36px; }
.racebar .pct { font-variant-numeric: tabular-nums; min-width: 3.5ch; text-align: right; }
.callout.key { border-left: 3px solid var(--msl); padding-left: 8px; }
table.race-opps .linkbtn, table.race .linkbtn { text-align: left; }
table.race-opps .tag { margin-top: 3px; display: inline-block; }
table.race-opps td:first-child .meta, table.race td { white-space: nowrap; }
table.race th .meta { text-transform: none; letter-spacing: 0; font-weight: 400; }
.st-ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.st-ctl select { width: auto; flex: 0 0 auto; }
.st-ctl input { flex: 1 1 190px; width: auto; }
table.stand td { white-space: nowrap; }
table.stand td.who { white-space: normal; }
table.stand th.n, table.stand td.n { text-align: right; width: 1%; padding-right: 10px; }
table.stand td.n { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--muted); }
table.stand tr.me td { background: color-mix(in oklab, var(--accent) 14%, transparent); font-weight: 700; }
table.stand tr.me td.n { color: var(--ink); }
table.stand tr.mate td.n { box-shadow: inset 3px 0 0 var(--accent); }
table.stand tr.out td, table.stand tr.out .linkbtn { color: var(--muted); }
table.stand tr.cutline td { font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--loss); border-bottom: 2px solid var(--loss); padding: 3px 8px; }
table.stand .linkbtn { text-align: left; }
table.stand .sub { display: none; }
@media (max-width: 620px) {
  table.stand .w { display: none; }
  table.stand .sub { display: block; }
}
.tip-list { margin: 4px 0 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.tip-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.tip-row { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; }
.tip-row > .k { color: var(--muted); font-size: 13px; min-width: 112px; }
.tip-row > .k b { color: var(--ink); font-size: 14px; }
.tip-row.better > .k, .tip-row.better > .k b { color: var(--win); font-weight: 700; }
.ins-fight { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.ins-fight:first-child { border-top: 0; padding-top: 0; }
.ins-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ins-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.ins-line > .k { color: var(--muted); font-size: 13px; min-width: 70px; }
.tag.bad { color: var(--loss); border-color: var(--loss); }
.tag.warn { color: var(--msl); border-color: var(--msl); }
.tag.ok { color: var(--win); border-color: var(--win); }
.status.ok { color: var(--win); border-color: color-mix(in oklab, var(--win) 40%, var(--line)); }
.status.warn { color: var(--msl); border-color: color-mix(in oklab, var(--msl) 45%, var(--line)); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
.tabs a { font-family: var(--cond); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; color: var(--muted); padding: 10px 12px 9px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

.note { border: 1px solid var(--line); border-left: 4px solid var(--msl); background: var(--panel); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.note.err { border-left-color: var(--loss); }
.note p { max-width: 70ch; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-h h2 { font-family: var(--cond); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.card-h .aside { font-size: 13px; color: var(--muted); }
.lbl { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.hint { text-transform: none; letter-spacing: 0; font-family: var(--body); font-weight: 400; }
.meta { font-size: 13px; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.quick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.quick .btn { flex: none; }
.quick.flow { flex-wrap: wrap; overflow: visible; }

input[type="text"], input:not([type]), select, textarea { background: var(--field); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; min-height: 120px; resize: vertical; }
select { appearance: auto; }
select.pick { font-size: 16px; font-weight: 600; padding: 10px 12px; }
.vsd { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.vsd::before, .vsd::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
.btn .rec { font-family: var(--body); font-weight: 500; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

.btn { border: 1px solid var(--line); background: var(--field); border-radius: 7px; padding: 8px 14px; font-family: var(--cond); font-weight: 700; letter-spacing: .04em; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--loss); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--field); }
.seg button { border: 0; background: transparent; padding: 6px 9px; font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: .05em; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg button.t-T[aria-pressed="true"] { background: var(--tank); color: var(--chip-ink); }
.seg button.t-A[aria-pressed="true"] { background: var(--air); color: var(--chip-ink); }
.seg button.t-M[aria-pressed="true"] { background: var(--msl); color: var(--chip-ink); }
.seg button.t-X[aria-pressed="true"] { background: var(--mix); color: var(--chip-ink); }

.slot { display: grid; grid-template-columns: 22px auto minmax(70px, 1fr); gap: 8px; align-items: center; }
.slot-n { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--muted); text-align: center; }
.slot input { text-align: right; font-variant-numeric: tabular-nums; }

/* squads */
.chip { --c: var(--mix); display: inline-flex; align-items: stretch; border-radius: 6px; border: 1px solid color-mix(in oklab, var(--c) 50%, transparent); background: color-mix(in oklab, var(--c) 13%, var(--panel)); overflow: hidden; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip b { background: var(--c); color: var(--chip-ink); font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .06em; padding: 2px 6px; display: flex; align-items: center; }
.chip span { padding: 2px 7px; font-weight: 600; font-size: 13px; }
.t-T { --c: var(--tank); } .t-A { --c: var(--air); } .t-M { --c: var(--msl); } .t-X { --c: var(--mix); }
.order { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.order .arr { width: 10px; height: 10px; border-top: 2px solid var(--muted); border-right: 2px solid var(--muted); transform: rotate(45deg) scale(.6); flex: none; }
.order.big { gap: 6px; }
.order.big .chip b { font-size: 15px; padding: 6px 9px; }
.order.big .chip span { font-size: 18px; padding: 5px 10px; }
.minis { display: inline-flex; gap: 2px; }
.mini { --c: var(--mix); display: inline-block; width: 18px; height: 18px; border-radius: 4px; background: var(--c); color: var(--chip-ink); font-family: var(--cond); font-weight: 700; font-size: 11px; line-height: 18px; text-align: center; }

/* next fight */
.grid-next { display: grid; grid-template-columns: minmax(290px, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.hero { border-left: 5px solid var(--accent); }
.stamp { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 2px solid currentColor; border-radius: 4px; padding: 1px 7px; transform: rotate(-2deg); display: inline-block; }
.big-num { font-family: var(--display); font-weight: 800; font-size: 56px; line-height: .9; letter-spacing: .01em; }
.big-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.big-row .cap { color: var(--muted); max-width: 32ch; padding-bottom: 6px; }
.callout { font-size: 14px; }
.foot { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }

.prow { display: grid; grid-template-columns: minmax(0, auto) minmax(60px, 1fr) 46px; gap: 10px; align-items: center; padding: 4px 0; }
.prow.top { font-weight: 700; }
.prow .pct { text-align: right; font-weight: 600; }
.bar { height: 8px; background: color-mix(in oklab, var(--line) 70%, transparent); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar.muted i { background: var(--muted); }
.tag { font-family: var(--cond); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
.tag.hot { color: var(--accent); border-color: var(--accent); }
.lead { font-size: 16px; }
.rematch { border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 12px; background: color-mix(in oklab, var(--accent) 7%, var(--panel)); display: flex; flex-direction: column; gap: 6px; }
.rematch .tag { margin-left: 0; margin-right: 6px; }

.tend { display: grid; grid-template-columns: minmax(130px, 210px) minmax(60px, 1fr) 42px; gap: 10px; align-items: center; font-size: 14px; }
.tend .pct { text-align: right; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scroll { overflow-x: auto; }
.mx td.cell { text-align: center; font-weight: 600; min-width: 52px; }
.mx th .p { display: block; font-family: var(--body); letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--ink); }
details > summary { cursor: pointer; font-family: var(--cond); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
details[open] > summary { margin-bottom: 10px; }

.pill { font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .06em; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.w { color: var(--win); } .pill.l { color: var(--loss); }
.ok { color: var(--win); } .bad { color: var(--loss); }

/* opponents */
.grid-opp { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
.plist { display: flex; flex-direction: column; gap: 2px; max-height: 70vh; overflow: auto; }
.plist button { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; gap: 4px; }
.plist button:hover { background: var(--field); }
.plist button[aria-current="true"] { background: var(--field); border-color: var(--accent); }
.plist .nm { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }

/* log */
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.side { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--field); }
.side.won { border-color: var(--win); box-shadow: inset 0 0 0 1px var(--win); }
.blist .b { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.blist .vs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.blist .who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.blist .rd { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--muted); }
.blist .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.stat { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.stat b { font-variant-numeric: tabular-nums; }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.empty { color: var(--muted); padding: 18px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; }

@media (max-width: 820px) {
  .grid-next { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .grid-next .col { display: contents; }
  .c-opp { order: 1; } .c-hero { order: 2; } .c-pred { order: 3; } .c-you { order: 4; } .c-mix { order: 5; } .c-mx { order: 6; }
  .grid-opp, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .plist { max-height: 260px; }
  .sides { grid-template-columns: minmax(0, 1fr); }
  .big-num { font-size: 48px; }
  .three { grid-template-columns: minmax(0, 1fr); }
  .tabs a { font-size: 14px; padding: 9px 9px 8px; }
  /* 16px stops phones zooming in when a field is tapped */
  input[type="text"], input:not([type]), select, textarea { font-size: 16px; }
}
@media (max-width: 420px) {
  .brand h1 { font-size: 28px; }
  .tend { grid-template-columns: minmax(110px, 1fr) 70px 40px; }
  .prow { grid-template-columns: minmax(0, auto) 50px 42px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .35s ease; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Duel Tracker</h1>
      <span class="sub">Last War · Champion Duel qualifier scouting</span>
    </div>
    <span class="top-right"><span id="status" class="status" role="status">Connecting…</span><button type="button" id="logout" class="logout" hidden>Log out</button></span>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#next" data-view="next">Next fight</a>
    <a href="#race" data-view="race">Top 8</a>
    <a href="#standings" data-view="standings">Standings</a>
    <a href="#insights" data-view="insights">Insights</a>
    <a href="#opponents" data-view="opponents">Opponents</a>
    <a href="#log" data-view="log">Battle log</a>
    <a href="#patterns" data-view="patterns">Patterns</a>
    <a href="#setup" data-view="setup">Setup</a>
  </nav>
  <div id="notes"></div>
  <main id="view"></main>
  <datalist id="dl-players"></datalist>
  <datalist id="dl-all"></datalist>
</div>
<script>
/* Champion Duel engine: fight simulator, opponent behavior model, recommender.
   Works in the browser (window.DuelEngine) and in Node (module.exports). */
(function (root) {
  'use strict';

  var TYPES = ['T', 'A', 'M', 'X'];
  var TYPE_NAME = { T: 'Tank', A: 'Aircraft', M: 'Missile', X: 'Mixed' };

    if (!db) { S.store = 'local'; S.standalone = !window.claude; loadLocal(); bump(); render(); return; }
    if (user) {
      try {
        const r = await Promise.all([user.id(), user.isOwner(), user.canEdit(), user.can('data.write')]);
        S.uid = r[0]; S.isOwner = !!r[1]; S.canEdit = !!r[2]; S.canWrite = r[3];
      } catch (e) { /* reads never reject; stay with defaults */ }
    }
    S.db = db; S.store = 'db'; render();
    const timer = setTimeout(() => {
      if (!S.loaded) { S.note = 'Your saved battles can’t be reached yet. The page keeps trying.'; S.noteErr = true; render(); }
    }, 10000);
    try {
      db.collection('battles').onSnapshot((snap) => {
        S.battles = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        if (S.busy === 'import' && S.loaded) return;
        if (!snap.metadata.fromCache && !S.loaded) {
          S.loaded = true; clearTimeout(timer);
          if (S.noteErr && /reached/.test(S.note)) { S.note = ''; S.noteErr = false; }
        }
        bump(); render();
      }, (e) => { clearTimeout(timer); S.loaded = true; S.note = errText(e); S.noteErr = true; render(); });
      db.doc('meta/settings').onSnapshot((snap) => {
        if (!snap.exists) return;
        S.shared = Object.assign({}, DEF_SHARED, snap.data());
        render();
      }, () => {});
      if (S.uid && S.canWrite !== false) {
        S.personalStore = 'db';
        db.doc('data/users/' + S.uid + '/settings').onSnapshot((snap) => {
          if (!snap.exists) return;
          S.personal = Object.assign({}, DEF_PERSONAL, snap.data());
          const ae = document.activeElement;
          if (!(ae && ae.dataset && ae.dataset.target === 'me')) S.meDraft = null;
          render();
        }, () => { S.personalStore = 'local'; loadPersonalLocal(); render(); });
      } else { S.personalStore = 'local'; loadPersonalLocal(); }
    } catch (e) { S.store = 'local'; loadLocal(); bump(); render(); }
  }

  /* ---------- rendering ---------- */
  let raf = 0;
  function render() {
    if (raf) return;
    raf = 1;
    (window.requestAnimationFrame || setTimeout)(() => { raf = 0; draw(); });
  }
  function draw() {
    const ae = document.activeElement, fid = ae && ae.id ? ae.id : null;
    let sel = null;
    try { if (fid && typeof ae.selectionStart === 'number') sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { sel = null; }
    const demoNow = isDemo();
    if (S.lastDemo !== undefined && S.lastDemo !== demoNow) {
      Object.assign(S, { opp: '', oppText: null, oppForm: null, sel: null, cal: null, roll: null, shownPerm: null, form: null });
    }
    S.lastDemo = demoNow;
    drawChrome();
    let html;
    try { html = S.bundleState === 'loading' && !S.battles.length && S.view !== 'setup' ? '<div class="empty">Loading fights…</div>' : VIEW[S.view](); }
    catch (e) { console.error(e); html = `<div class="empty">This view hit a problem: ${esc(e.message)}</div>`; }
    document.getElementById('view').innerHTML = html;
    if (fid) {
      const el = document.getElementById(fid);
      if (el && document.activeElement !== el) {
        try { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ }
      }
    }
  }
  let DLK = '';
  function drawChrome() {
    const st = document.getElementById('status');
    let txt = 'Connecting…', cls = 'status';
    if (S.store === 'db') { txt = S.loaded ? (S.isOwner ? 'Saved to your tracker' : 'Shared team tracker') : 'Loading saved battles…'; if (S.loaded) cls += ' ok'; }
    else if (S.store === 'local') { if (S.standalone) { txt = 'Your picks save on this device'; cls += ' ok'; } else { txt = 'Saving in this browser only'; cls += ' warn'; } }
    st.textContent = txt; st.className = cls;
    document.querySelectorAll('.tabs a').forEach((a) => {
      if (a.dataset.view === S.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    let notes = '';
    if (isDemo()) notes += '<div class="note"><p><b>Example data.</b> These fights are made up so you can see how the tracker works. Log your own battle reports, or send them to Claude to import, and this goes away.</p><button class="btn small" data-act="real">Use my own data</button></div>';
    if (S.note) notes += `<div class="note${S.noteErr ? ' err' : ''}"><p>${esc(S.note)}</p><button class="btn small" data-act="dismiss">Dismiss</button></div>`;
    document.getElementById('notes').innerHTML = notes;
    // Typing suggestions for the free-text name boxes; rebuilt only when the log changes.
    const P = fullIndex().players, dk = FIK + '|' + key(settings().me);
    if (DLK !== dk) {
      DLK = dk;
      const meK = key(settings().me), names = Object.values(P);
      document.getElementById('dl-players').innerHTML = names.filter((p) => p.key !== meK).map((p) => `<option value="${esc(p.name)}"></option>`).join('');
      const all = document.getElementById('dl-all');
      if (all) all.innerHTML = names.map((p) => `<option value="${esc(p.name)}"></option>`).join('');
    }
  }

  function slots(target, form) {
    return `<div class="stack">${form.map((q, s) => `<div class="slot"><span class="slot-n" aria-hidden="true">${s + 1}</span>
      <div class="seg" role="group" aria-label="Slot ${s + 1} troop type">${['T', 'A', 'M', 'X'].map((t) => `<button type="button" class="t-${t}" data-act="type" data-target="${target}" data-slot="${s}" data-t="${t}" aria-pressed="${q.t === t}" title="${E.TYPE_NAME[t]}">${TS[t]}</button>`).join('')}</div>
      <input id="${target}-p${s}" type="text" inputmode="decimal" autocomplete="off" data-target="${target}" data-slot="${s}" value="${esc(q.p == null ? '' : q.p)}" placeholder="Power, M" aria-label="Slot ${s + 1} power in millions">
    </div>`).join('')}</div>`;
  }
  function tendRows(w, r) {
    const rows = E.EXPERTS.map((e) => ({ label: E.EXPERT_INFO[e].label, blurb: E.EXPERT_INFO[e].blurb, v: w[e] * (r ? 1 - r : 1) }));
    if (r) rows.push({ label: E.REMATCH_INFO.label, blurb: E.REMATCH_INFO.blurb, v: r });
    return rows.sort((x, y) => y.v - x.v).map((x) => `<div class="tend" title="${esc(x.blurb)}"><span>${x.label}</span><div class="bar"><i style="width:${(x.v * 100).toFixed(1)}%"></i></div><span class="pct">${pct(x.v)}</span></div>`).join('');
  }
  const stat = (label, value) => `<div class="stat"><span>${label}</span><b>${value}</b></div>`;

  /* ---------- Next fight ---------- */
  function viewNext() {
    const ix = fullIndex();
    if (isDemo() && !S.opp && !S.oppManual) setOpp(pickDemoOpp());
    if (S.opp && !S.oppForm) setOpp(S.opp);
    const mf = myForm();
    const pl = S.opp ? ix.players[key(S.opp)] : null;
    if (S.opp && S.oppVersion !== S.version) {
      const v = valid(S.oppForm);
      if (!S.oppEdited || (pl && v && pl.entries.some((e) => E.sameForm(v, e.form)))) setOpp(S.opp);
      else S.oppVersion = S.version;
    }
    const latest = pl ? pl.entries[pl.entries.length - 1] : null;
    const mine = myLog(), meName = settings().me, hasLog = ix.battles.length > 0;
    const likely = likelyOpps().filter((x) => key(x.name) !== key(S.opp));
    const src = isDemo() ? 'example squads' : valid(S.personal.myForm) ? 'entered by hand in <a href="#setup">Setup</a>' : mine ? `from your round ${esc(mine.round)} report` : '';
    const rx = raceOf(meName);
    const raceLine = rx ? `<p class="meta">Top 8 chance: <b>${pct(rx.r[3])}</b> · #${rx.i + 1} in group ${esc(rx.g)} · <a href="#race">The race</a></p>` : '';
    const meNote = mf ? `<div class="row">${orderHTML(mf)}<span class="meta">${src}</span></div>`
      : meName ? `<p class="meta">No fights logged under this name yet. Add your squads in <a href="#setup">Setup</a>.</p>`
      : `<p class="meta">${hasLog ? 'Your squads fill in from your latest battle report.' : 'Or add your squads in Setup.'}</p>`;

    let opp = `<section class="card c-opp" aria-labelledby="h-opp">
      <div class="card-h"><h2 id="h-opp">Matchup</h2></div>
      <div class="field"><label class="lbl" for="me-pick">You</label>${meSelect('me-pick')}${meNote}${raceLine}</div>
      <div class="vsd" aria-hidden="true">vs</div>
      <div class="field"><label class="lbl" for="opp-pick">Opponent</label>${oppSelect()}</div>
      ${likely.length ? `<div class="stack"><span class="lbl">${likely[0].chance != null ? 'Likely next round' : 'Likely next, by record'}</span><div class="quick flow" role="group" aria-label="Likely next opponents">${likely.map((x) => `<button type="button" class="btn small" data-act="opp" data-name="${esc(x.name)}">${esc(short(x.name.replace(/^\[Example\] /, '')))} <span class="rec">${x.chance != null ? pct(x.chance) : `${x.w}–${x.l}`}</span></button>`).join('')}</div></div>` : ''}`;
    const manualOpp = S.oppManual || (!!S.opp && !pl);
    if (S.opp || manualOpp) {
      const open = manualOpp || S.oppOpen || S.oppEdited;
      opp += `<p class="meta">${latest ? `Last logged: round ${esc(latest.round)}, ${latest.won ? 'won' : 'lost'} against ${esc(latest.oppName)}.` : 'Not in the log yet. Enter the formation their battle record shows.'}</p>`;
      opp += keyFacts(pl);
      if (!open) {
        opp += `<div class="stack"><div class="lbl"><span>Their last formation</span><span class="hint">Slot 1 fights first</span></div>${orderHTML(valid(S.oppForm) || latest.form)}
          <p class="meta">Game shows a newer one? <button type="button" class="linkbtn" data-act="oedit">Edit it</button></p></div>`;
      } else {
        opp += `<div class="lbl"><span>Their last formation</span><span class="hint">Slot 1 fights first · squad power without troops</span></div>
      ${slots('opp', draftOf('opp'))}
      <div class="lbl"><span>Their last result</span></div>
      <div class="seg" role="group" aria-label="Their last result">
        <button type="button" data-act="ores" data-v="W" aria-pressed="${S.oppResult === 'W'}">Won</button>
        <button type="button" data-act="ores" data-v="L" aria-pressed="${S.oppResult === 'L'}">Lost</button>
        <button type="button" data-act="ores" data-v="" aria-pressed="${!S.oppResult}">Not sure</button>
      </div>
      ${pl && S.oppEdited ? '<p class="meta">This differs from their latest logged fight, so it counts as a newer formation. <button type="button" class="linkbtn" data-act="oreset">Reset to log</button></p>' : pl ? '<p class="meta"><button type="button" class="linkbtn" data-act="oedit">Done</button></p>' : ''}`;
      }
    }
    opp += '</section>';

    let you = '<section class="card c-you" aria-labelledby="h-you"><div class="card-h"><h2 id="h-you">You</h2><a href="#setup">Edit squads</a></div>';
    let pr = null, waiting = false;
    if (mf) {
      const mc = E.canonical(mf).canon, ds = defaultShown(mf);
      const shownK = S.shownPerm != null ? S.shownPerm : ds.k;
      you += `<div class="field"><label class="lbl" for="shown">What they'll see of you</label>
        <select id="shown">${E.PERMS.map((_, k) => `<option value="${k}"${k === shownK ? ' selected' : ''}>${esc(permText(mc, k))}${k === ds.k ? (ds.fromLog ? ' (last fight)' : ' (current)') : ''}</option>`).join('')}</select>
        <p class="meta">They see the formation from your last fight, the same way you see theirs.</p></div>`;
      const of = valid(S.oppForm);
      if (S.opp && of) {
        if (modelReady()) pr = E.predict(model(), { opp: S.opp, oppForm: S.oppEdited ? of : null, oppLastResult: S.oppResult, myForm: mf, myShown: E.orderSquads(mc, shownK) });
        else { waiting = true; buildModelSoon(); }
      }
    } else {
      you += hasLog && !meName ? '<p>Pick your name under Matchup. Your squads fill in from your latest battle report.</p>'
        : '<p>Add your three squads in Setup so the tracker can simulate your fights.</p><div><a class="btn primary" href="#setup">Go to Setup</a></div>';
    }
    you += '</section>';

    let out;
    if (pr) { const kill = pr.ev[pr.best] < 0.1 ? killPlan(pr, pl) : null; out = (kill ? killCard(pr, kill) : heroCard(pr)) + ovCard(pr, mf) + predCard(pr) + scoutCard(pl, pr, mf) + mixCard(pr) + mxCard(pr); }
    else if (waiting) out = '<section class="card hero c-hero"><div class="card-h"><h2>Play this order</h2></div><div class="empty">Working out the call…</div></section>';
    else {
      const msg = !mf ? (hasLog && !meName ? 'Pick your name to get a call.' : 'Add your squads in Setup to get a call.') : !S.opp ? (S.oppManual ? 'Type their name and formation to get a call.' : 'Pick your opponent to get a call.') : 'Enter type and power for all three of their squads to get a call.';
      out = `<section class="card hero c-hero"><div class="card-h"><h2>Play this order</h2></div><div class="empty">${msg}</div></section>`;
    }
    return `<div class="grid-next"><div class="col">${opp}${you}</div><div class="col">${out}</div></div>`;
  }
  // Your Overlord: the same call with it on each of your teams. Only when your squads come from a battle report,
  // since that is what shows where the Overlord sits and how much power it adds.
  function ovCard(pr, mf) {
    const mine = myLog(), ex = !isDemo() && !valid(S.personal.myForm) && mine && mine.ex;
    if (!ex || !ex.ov || !(ex.op > 0) || !mf.some((q) => q.id === ex.ov)) return '';
    const m = model(), of = valid(S.oppForm), mc = E.canonical(mf).canon;
    const shownK = S.shownPerm != null ? S.shownPerm : defaultShown(mf).k;
    // Every row (the current spot too) uses the same lighter simulation, so the rows compare fairly.
    const spots = mf.map((q) => q.id).filter(Boolean).sort((a, b) => (a === ex.ov ? -1 : b === ex.ov ? 1 : 0)).map((id) => ({
      id, pr: E.predict(m, { opp: S.opp, oppForm: S.oppEdited ? of : null, oppLastResult: S.oppResult, myForm: id === ex.ov ? mf : E.moveOverlord(mf, ex, id), myShown: E.orderSquads(mc, shownK), sims: 600 })
    })).filter((x) => x.pr).map((x) => Object.assign(x, { ev: x.pr.ev[x.pr.best] }));
    const now = spots[0], best = spots.slice().sort((a, b) => b.ev - a.ev)[0], main = E.mainType(ex.tb);
    const head = best.id === now.id || best.ev - now.ev < 0.03
      ? `Keep it on ${esc(teamLabel(mf, now.id))}. Moving it doesn't improve this matchup.`
      : `Moving it to ${esc(teamLabel(mf, best.id))} raises your chance from ${pct(now.ev)} to ${pct(best.ev)}, with the order shown for that row.`;
    return `<section class="card c-ov" aria-labelledby="h-ov">
      <div class="card-h"><h2 id="h-ov">Your Overlord</h2><span class="aside">adds ${fmtP(ex.op)}M to its squad</span></div>
      <p class="callout">${head}</p>
      <div class="scroll"><table><thead><tr><th>Overlord on</th><th>Best order</th><th>Chance</th></tr></thead><tbody>
        ${spots.map((x) => `<tr${x === best && best.ev - now.ev >= 0.03 ? ' class="best"' : ''}><td>${esc(teamLabel(mf, x.id))}${x === now ? ' <span class="meta">now</span>' : ''}</td><td>${permHTML(x.pr.myCanon, x.pr.best)}</td><td>${pct(x.ev)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="foot">${main ? `Your main type is ${E.TYPE_NAME[main]} (highest type bonus, our stand-in for mastery). ` : ''}Most players keep the Overlord on their main squad, next to their best gear. Moving it shifts the Overlord's own power and the few hundred troops it brings, not your gear.</p>
    </section>`;
  }
  // Key facts about the chosen opponent, highlighted under their name in the Matchup card.
  function keyFacts(pl) {
    if (!pl || !pl.entries.length) return '';
    const es = pl.entries, n = es.length, facts = [];
    const wins = es.filter((e) => e.won).length;
    const canon = E.canonical(es[n - 1].form).canon, perms = es.map((e) => E.matchPerm(e.form, canon));
    const sameAll = n >= 3 && new Set(perms).size === 1;
    if (sameAll) facts.push({ t: `Same order all ${n} fights`, hot: true });
    else if (n >= 3) {
      let kept = 0;
      for (let i = 1; i < n; i++) if (perms[i] === perms[i - 1]) kept++;
      const r = kept / (n - 1);
      facts.push({ t: r >= 0.7 ? `Usually keeps their order (${kept} of ${n - 1})` : r <= 0.3 ? `Changes order often (kept it ${kept} of ${n - 1})` : `Sometimes changes order (kept it ${kept} of ${n - 1})`, hot: r >= 0.7 });
    }
    const h = habitsOf(pl);
    if (h) {
      const tt = (id) => TS[h.types[id]] || 'team ' + id;
      if (h.tbs.length) {
        const bal = h.tbs.length > 1 && h.tbs[0][1] - h.tbs[1][1] < 0.03;
        facts.push({ t: bal ? 'Balanced main type' : `${E.TYPE_NAME[h.tbs[0][0]]} main`, hot: !bal });
      }
      if (h.ov) facts.push(h.ovMoves ? { t: `Moves their Overlord (${plural(h.ovMoves, 'time')})`, hot: true } : { t: `Overlord ${h.ovN >= 3 ? 'locked on' : 'on'} ${tt(h.ov)}`, hot: h.ovN >= 3 });
      if (h.gearMoves) facts.push({ t: `Moves gear between squads (${plural(h.gearMoves, 'time')})`, hot: true });
      else if (h.m6Total) facts.push(h.gearLocked ? { t: `Mythic gear locked on ${tt(h.m6Teams[0])}`, hot: true }
        : { t: `Mythic gear on ${h.m6Teams.map(tt).join(' + ')}${h.n >= 3 ? ', never moved' : ''}`, hot: h.n >= 3 });
      else facts.push({ t: h.gpTeams.length ? `No mythic gear · best gear on ${tt(h.gpTeams[0])}` : 'No mythic gear', hot: false });
    }
    const sg = strongHabit(pl);
    if (sg && sg.dodges) facts.push({ t: `Strong squad (${TS[sg.q.t]}) dodges counters`, hot: true });
    else if (sg && !sameAll && sg.pairs >= 3 && sg.moves === 0) facts.push({ t: `Strong squad (${TS[sg.q.t]}) always ${ORD[sg.slot]}`, hot: true });
    const meK = key(settings().me), met = es.filter((e) => e.oppKey === meK);
    if (met.length) { const last = met[met.length - 1]; facts.push({ t: `Rematch: you ${last.won ? 'lost' : 'won'} round ${last.round}`, hot: true }); }
    const orx = raceOf(pl.name);
    if (orx) facts.push({ t: `Top 8 chance ${pct(orx.r[3])}`, hot: false });
    facts.push({ t: orx ? `${orx.r[2]}–${S.race.round - orx.r[2]} record` : `${wins}–${n - wins} record`, hot: false });
    return `<div class="facts" role="list" aria-label="Key facts">${facts.map((f) => `<span role="listitem" class="fact${f.hot ? ' hot' : ''}">${esc(f.t)}</span>`).join('')}</div>`;
  }
  // The opponent's main type, Overlord and mythic gear, and what changes if they move their Overlord.
  function scoutCard(pl, pr, mf) {
    const h = habitsOf(pl);
    if (!h) return '';
    const tl = (id) => esc(teamLabel(h.last.form, id)), rows = [];
    if (h.tbs.length) {
      const [t1, v1] = h.tbs[0], second = h.tbs[1];
      rows.push(stat('Main type <span class="meta">(highest type bonus)</span>', second && v1 - second[1] < 0.03
        ? `Balanced <span class="meta">${h.tbs.map(([t, v]) => TS[t] + ' ' + pct(v)).join(' · ')}</span>`
        : `${E.TYPE_NAME[t1]} <span class="meta">${pct(v1)}${second ? ' vs ' + pct(second[1]) : ''}</span>`));
    }
    rows.push(stat(`Overlord${h.op ? ` <span class="meta">${fmtP(h.op)}M</span>` : ''}`, h.ov
      ? `${tl(h.ov)}${h.main && h.types[h.ov] === h.main ? ', their main' : ''} · ${h.ovMoves ? 'moved ' + plural(h.ovMoves, 'time') : h.ovN > 1 ? 'never moved' : 'one fight seen'}`
      : 'none seen'));
    if (h.gpTeams.length) rows.push(stat('Gear power <span class="meta">(levels and stars counted)</span>',
      `${h.last.form.map((q) => `${TS[q.t]} ${fmtP(h.gp[q.id] || 0)}M`).join(' · ')} · ${h.gearMoves ? 'gear moved ' + plural(h.gearMoves, 'time') : h.n > 1 ? 'never moved' : 'one fight seen'}`));
    rows.push(stat('Mythic gear <span class="meta">(5★ pieces)</span>', h.m6Total
      ? `${h.m6Teams.map((id) => `${h.m6[id]} on ${tl(id)}`).join(', ')}${h.gpTeams.length ? '' : ` · ${h.gearMoves ? 'moved ' + plural(h.gearMoves, 'time') : h.n > 1 ? 'never moved' : 'one fight seen'}`}`
      : 'none'));
    if (Object.keys(h.ur).length) rows.push(stat('UR gear <span class="meta">(0–4★ pieces)</span>', h.last.form.map((q) => `${h.ur[q.id] || 0} on ${TS[q.t]}`).join(' · ')));
    const sg = strongHabit(pl);
    if (sg) rows.push(stat('Strong squad <span class="meta">(Overlord + best gear)</span>', `${TS[sg.q.t]} · ${sg.pairs ? (sg.moves ? `moved ${sg.moves} of ${sg.pairs} times` : `always ${ORD[sg.slot]}`) : 'one fight seen'}${sg.n ? ` · opposite its counter ${sg.faced} of ${sg.n} times <span class="meta">(about ${Math.round(sg.exp)} at random)</span>` : ''}`));
    let alt = '';
    if (h.ov && h.op > 0 && !S.oppEdited && mf) {
      const m = model(), mc = E.canonical(mf).canon, shownK = S.shownPerm != null ? S.shownPerm : defaultShown(mf).k;
      const base = E.predict(m, { opp: S.opp, oppForm: h.last.form, oppHypo: true, oppLastResult: S.oppResult, myForm: mf, myShown: E.orderSquads(mc, shownK), sims: 600 });
      const now = base ? base.ev[pr.best] : pr.ev[pr.best];
      const lines = h.last.form.map((q) => q.id).filter((id) => id && id !== h.ov).map((id) => {
        const p2 = E.predict(m, { opp: S.opp, oppForm: E.moveOverlord(h.last.form, h.ex, id), oppHypo: true, oppLastResult: S.oppResult, myForm: mf, myShown: E.orderSquads(mc, shownK), sims: 600 });
        return p2 && { id, p2, keep: p2.ev[pr.best], best: p2.ev[p2.best] };
      }).filter(Boolean);
      const matters = lines.filter((x) => now - x.keep >= 0.05 || x.p2.best !== pr.best && x.best - x.keep >= 0.05);
      alt = matters.length
        ? `<p class="meta">If they move their Overlord:</p>${matters.map((x) => `<div class="ins-line"><span class="k">to ${tl(x.id)}</span>${x.p2.best === pr.best ? `your order above drops to ${pct(x.keep)}` : `${permHTML(x.p2.myCanon, x.p2.best)} ${pct(x.best)} <span class="meta">(the order above: ${pct(x.keep)})</span>`}</div>`).join('')}`
        : `<p class="meta">If they move their Overlord, the order above still holds up.</p>`;
    }
    return `<section class="card c-scout" aria-labelledby="h-scout"><div class="card-h"><h2 id="h-scout">Their main squad</h2><span class="aside">from ${plural(h.n, 'report')}</span></div>
      <div>${rows.join('')}</div>${alt}
      <p class="foot">Players with one high mastery almost never move the Overlord off that squad, and keep their best gear there too: in the reports, 97% have the Overlord on their main-type squad.</p></section>`;
  }
  function heroCard(pr) {
    const b = pr.best, ev = pr.ev[b], gain = ev - pr.nash.value;
    const others = pr.ranked.slice(1);
    const minAll = Math.min.apply(null, pr.worst), maxAll = Math.max.apply(null, pr.ev);
    const lopsided = minAll >= 0.98 ? 'Every order wins this fight: your squads are far stronger, so order only matters for how many troops you keep.'
      : maxAll <= 0.02 ? 'No order wins this one on paper: their squads are far stronger. The order shown loses the least badly.' : '';
    return `<section class="card hero c-hero" aria-labelledby="h-hero">
      <div class="card-h"><h2 id="h-hero">Play this order</h2><span class="stamp">vs ${esc(short(S.opp))}</span></div>
      ${permHTML(pr.myCanon, b, true)}
      <div class="big-row"><span class="big-num">${pct(ev)}</span><span class="cap">chance to win if they play the way the model expects</span></div>
      ${ev >= 0.35 && ev <= 0.65 ? '<p class="callout key"><b>Key match:</b> about even. Toss-ups like this decide the top 8, so check their latest formation in the game before you lock in.</p>' : ''}
      ${lopsided ? `<p class="callout">${lopsided}</p>` : `<p class="callout">Worst case ${pct(pr.worst[b])}, if they play ${minis(E.orderSquads(pr.theirCanon, pr.worstAgainst[b]))}. ${gain < 0.02 ? 'Reading this player barely helps here, so the safe mix below is about as good.' : `The safe mix only guarantees ${pct(pr.nash.value)}.`}</p>`}
      <div class="scroll"><table><thead><tr><th>Other orders</th><th>If predicted</th><th>Worst case</th></tr></thead><tbody>
        ${others.map((k) => `<tr><td>${permHTML(pr.myCanon, k)}</td><td>${pct(pr.ev[k])}</td><td>${pct(pr.worst[k])}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="foot">Whatever you play now becomes the formation your next opponent sees.</p>
    </section>`;
  }
  function predCard(pr) {
    const order = E.PERMS.map((_, k) => k).sort((a, b) => pr.p[b] - pr.p[a]);
    const top = order[0];
    let lead;
    if (pr.theirLastPerm == null) lead = `Most likely order: ${pct(pr.p[top])}.`;
    else if (pr.theirLastPerm === top) lead = `Most likely they repeat their last order (${pct(pr.p[top])}).`;
    else lead = `Most likely they switch away from their last order (${pct(pr.p[top])} on the top pick).`;
    const basis = pr.known
      ? `Based on ${plural(pr.nFights, 'logged fight')}${pr.extraSeen ? ' plus the formation you entered' : ''}. Players with few fights lean on how your whole log behaves.`
      : 'No fights logged for this player, so this uses how opponents in your log usually play.';
    const rm = pr.rematch;
    const rmBox = rm ? `<div class="rematch"><p><span class="tag hot">Rematch</span> In round ${esc(rm.round)} they played ${minis(rm.theirForm)} against your ${minis(rm.myForm)} and ${rm.theyWon ? 'won' : 'lost'}. ${rm.theyWon ? 'A player who remembers would replay the order that beat you.' : 'A player who remembers would counter the order that beat them.'}</p>
      <p class="meta">The model gives that ${pct(rm.r)} weight, ${rm.n ? `from their ${plural(rm.n, 'earlier rematch')} and your whole log` : 'from how players in your log handle rematches'}.</p></div>` : '';
    return `<section class="card c-pred" aria-labelledby="h-pred">
      <div class="card-h"><h2 id="h-pred">Their likely order</h2></div>
      <p class="lead">${lead}</p>
      ${rmBox}
      <div class="stack">${order.map((k, i) => `<div class="prow${i === 0 ? ' top' : ''}"><span class="row">${permHTML(pr.theirCanon, k)}${k === pr.theirLastPerm ? '<span class="tag">Last played</span>' : ''}</span><div class="bar${i ? ' muted' : ''}"><i style="width:${(pr.p[k] * 100).toFixed(1)}%"></i></div><span class="pct">${pct(pr.p[k])}</span></div>`).join('')}</div>
      <div class="lbl"><span>How they decide</span></div>
      <div class="stack">${tendRows(pr.weights, rm ? rm.r : 0)}</div>
      <p class="foot">${basis}</p>
    </section>`;
  }
  function mixCard(pr) {
    const rows = E.PERMS.map((_, k) => k).filter((k) => pr.nash.row[k] > 0).sort((a, b) => pr.nash.row[b] - pr.nash.row[a]);
    return `<section class="card c-mix" aria-labelledby="h-mix">
      <div class="card-h"><h2 id="h-mix">Safe mix</h2><span class="aside">floor ${pct(pr.nash.value)}</span></div>
      <p>If you'd rather not be read, pick at random with these odds. Whatever they play, you win at least ${pct(pr.nash.value)} of the time.</p>
      <div class="stack">${rows.map((k) => `<div class="prow"><span>${permHTML(pr.myCanon, k)}</span><div class="bar muted"><i style="width:${(pr.nash.row[k] * 100).toFixed(1)}%"></i></div><span class="pct">${pct(pr.nash.row[k])}</span></div>`).join('')}</div>
      <div class="row"><button type="button" class="btn" data-act="roll">Pick one for me</button>${S.roll != null ? `<span class="row">Play ${permHTML(pr.myCanon, S.roll)}</span>` : ''}</div>
    </section>`;
  }
  function mxCard(pr) {
    const cols = E.PERMS.map((_, k) => k).sort((a, b) => pr.p[b] - pr.p[a]);
    const cell = (v) => {
      const d = Math.min(55, Math.abs(v - 0.5) * 2 * 55).toFixed(0);
      return `background: color-mix(in oklab, ${v >= 0.5 ? 'var(--win)' : 'var(--loss)'} ${d}%, var(--panel))`;
    };
    return `<section class="card c-mx"><details><summary>All 36 matchups: your win chance</summary>
      <div class="scroll"><table class="mx"><thead><tr><th>You \\ They</th>${cols.map((j) => `<th>${minis(E.orderSquads(pr.theirCanon, j))}<span class="p">${pct(pr.p[j])}</span></th>`).join('')}</tr></thead>
      <tbody>${pr.ranked.map((i) => `<tr><th>${minis(E.orderSquads(pr.myCanon, i))}</th>${cols.map((j) => `<td class="cell" style="${cell(pr.Wme[i][j])}">${pct(pr.Wme[i][j])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="meta">Columns are their orders, most likely first, with the model's odds under each. Rows are your orders, best first.</p></details></section>`;
  }

  /* ---------- Opponents ---------- */
  function viewOpponents() {
    const m = model(), list = players();
    if (!list.length) return '<div class="empty">No opponents logged yet. Add battle reports in the <a href="#log">Battle log</a>.</div>';
    const sk = S.sel && m.index.players[S.sel] && S.sel !== m.meKey ? S.sel : list[0].key;
    const p = m.index.players[sk], w = m.playerW[sk], obs = m.obsBy[sk], calls = wf().calls[sk] || [];
    const scored = calls.filter(Boolean), hits = scored.filter((c) => c.hit).length;
    const latest = p.entries[p.entries.length - 1];
    const left = `<section class="card"><div class="card-h"><h2>Opponents</h2><span class="aside">${list.length}</span></div>
      <div class="plist">${list.map((q) => `<button type="button" data-act="sel" data-k="${esc(q.key)}" aria-current="${q.key === sk}"><span class="nm"><span>${esc(q.name)}</span><span class="meta">${q.w}–${q.n - q.w}</span></span><span class="row">${minis(q.last.form)}<span class="meta">${E.EXPERT_INFO[topTendency(m.playerW[q.key])].label}</span></span></button>`).join('')}</div></section>`;
    const rows = p.entries.map((e, t) => ({ e, t })).reverse().map(({ e, t }) => {
      const o = obs[t], c = calls[t];
      const call = c ? (c.hit ? '<span class="ok">Right</span>' : `<span class="bad">Missed</span> ${minis(E.orderSquads(o.canon, c.top))}`) : '<span class="meta">First fight</span>';
      return `<tr><td class="num">${esc(e.round)}</td><td>${orderHTML(e.form)}</td><td>${esc(e.oppName)}${o.rm ? ' <span class="tag">Rematch</span>' : ''}</td><td>${o.seen.proxy ? '<span class="meta" title="Their opponent’s earlier fight isn’t logged, so this shows what that opponent played here">~</span> ' : ''}${minis(o.seen.lastForm)}</td><td>${e.won ? '<span class="pill w">Won</span>' : '<span class="pill l">Lost</span>'}</td><td>${call}</td></tr>`;
    }).join('');
    const right = `<section class="card"><div class="card-h"><h2>${esc(p.name)}</h2><button type="button" class="btn small primary" data-act="scout" data-name="${esc(p.name)}">Scout as next opponent</button></div>
      <div class="row"><span class="lbl">Latest order</span>${orderHTML(latest.form)}</div>
      <div class="lbl"><span>How they decide</span><span class="hint">${scored.length ? `Model called ${hits} of ${scored.length} of their fights right` : 'Needs two fights to test the model'}</span></div>
      <div class="stack">${tendRows(w)}</div>
      ${m.playerRm[sk].n ? `<p class="meta">In ${plural(m.playerRm[sk].n, 'rematch')}, the model puts ${pct(m.playerRm[sk].r)} weight on them remembering the last meeting (replaying what won, or countering what beat them).</p>` : ''}
      <div class="scroll"><table><thead><tr><th>Round</th><th>Played</th><th>Against</th><th>They could see</th><th>Result</th><th>Model's call</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="meta">"They could see" is their opponent's formation from the round before. A ~ means that fight isn't logged, so it shows what the opponent played in this one. Each call uses only fights logged before it.</p>
    </section>`;
    return `<div class="grid-opp">${left}${right}</div>`;
  }

  /* ---------- Battle log ---------- */
  function form() {
    if (!S.form) {
      const st = baseSettings(), rounds = S.battles.map((b) => +b.round).filter(isFinite);
      S.form = { round: rounds.length ? String(Math.max.apply(null, rounds)) : '1', a: { name: st.me || '', s: st.myForm ? clone(st.myForm) : blank(), touched: false }, b: { name: '', s: blank(), touched: false }, win: '' };
    }
    return S.form;
  }
  function prefillSide(sd) {
    const f = form(), s = f[sd];
    if (s.touched || !s.name) return;
    const pl = fullIndex().players[key(s.name)];
    if (pl) s.s = clone(pl.entries[pl.entries.length - 1].form);
    else if (key(s.name) === key(baseSettings().me) && baseSettings().myForm) s.s = clone(baseSettings().myForm);
  }
  function viewLog() {
    const f = form();

    const G = groupInfo(), meK = key(settings().me), myR = G.ix.players[meK] ? G.comp[meK] : null;
    const scoped = !S.logAll && G.roots.length > 1 && !!myR;
    const list = G.ix.battles.filter((b) => !scoped || G.comp[key(b.a.name)] === myR).slice().sort((x, y) => (+y.round - +x.round) || String(y.created || '').localeCompare(String(x.created || '')));

    const add = `<section class="card" aria-labelledby="h-add"><div class="card-h"><h2 id="h-add">Add a battle report</h2><span class="aside">From the duel's Record screen</span></div>
      <div class="row"><div class="field" style="width:120px"><label class="lbl" for="f-round">Round</label><input id="f-round" type="text" inputmode="decimal" value="${esc(f.round)}"></div>
        <p class="meta" style="max-width:46ch">The qualifier fight number. Any number that goes up with time works, as long as everyone's fights use the same scale.</p></div>

      <div class="row"><button type="button" class="btn primary" data-act="fsave"${canAdd() ? '' : ' disabled'}>Save battle</button><span class="meta" role="status">${esc(canAdd() ? S.formMsg : 'You have view access. Ask the owner for Contributor access to add reports.')}</span></div>
      <p class="meta">Side A stays filled after saving, so you can log the next fight from the same player's record.</p>
    </section>`;
    const shown = S.showAll ? list : list.slice(0, 60);
    const rows = shown.map((b) => {
      const n = E.normBattle(b);
      if (!n) return '';
      let del = '';
      if (!isDemo() && b.id && canAdmin()) {
        del = S.confirm === b.id
          ? `<span class="row"><button type="button" class="btn small danger" data-act="del" data-id="${esc(b.id)}">Delete</button><button type="button" class="btn small" data-act="nodel">Keep</button></span>`
          : `<button type="button" class="btn small" data-act="askdel" data-id="${esc(b.id)}" aria-label="Delete round ${esc(n.round)}, ${esc(n.a.name)} against ${esc(n.b.name)}">Delete</button>`;
      }

      return `<div class="b"><span class="rd" title="Round">${esc(n.round)}</span><div class="vs">${who('a')}${who('b')}</div>${del}</div>`;
    }).join('');
    const logCard = `<section class="card" aria-labelledby="h-list"><div class="card-h"><h2 id="h-list">Battles</h2><span class="row"><span class="aside">${list.length.toLocaleString()}${scoped ? ' in ' + esc(groupName(G, myR)) : ''}</span>${G.roots.length > 1 && myR ? `<button type="button" class="btn small" data-act="logall">${S.logAll ? 'Only my group' : 'All groups'}</button>` : ''}</span></div>
      ${list.length ? `<div class="blist">${rows}</div>${list.length > shown.length ? `<button type="button" class="btn" data-act="all">Show all ${list.length}</button>` : ''}` : '<div class="empty">Nothing logged yet.</div>'}</section>`;
    return `<div class="stack" style="gap:16px">${add}${logCard}</div>`;
  }

  /* ---------- Patterns ---------- */
  function viewPatterns() {
    const m = model();
    const keys = Object.keys(m.obsBy).filter((k) => k !== m.meKey);
    const all = [].concat.apply([], keys.map((k) => m.obsBy[k]));
    if (!all.length) return '<div class="empty">Patterns appear once you’ve logged some battles.</div>';
    const st = E.habitStats(all), W = wf(), r = (a, b) => (b ? pct(a / b) : '–');
    const pop = `<section class="card"><div class="card-h"><h2>How your opponents decide</h2><span class="aside">${plural(all.length, 'fight')}, ${plural(keys.length, 'player')}</span></div>
      <div class="stack">${tendRows(m.popW)}</div>
      <div>${stat('Kept the same order as their previous fight', r(st.kept, st.withPrev))}
        ${stat('Kept it after a win', r(st.keptAfterWin, st.afterWin))}
        ${stat('Kept it after a loss', r(st.keptAfterLoss, st.afterLoss))}
        ${stat(`Played the best counter to what they could see <span class="meta">(random picks would: ${r(st.counterChance, st.n)})</span>`, r(st.countered, st.n))}
        ${stat('Led with their strongest squad', r(st.strongestFirst, st.n))}
        ${st.rematch ? stat(`Rematches <span class="meta">(${st.rematch})</span>: replayed the order that won last time`, r(st.rmReplayed, st.rmWonPrev)) + stat('Rematches: countered the order that beat them last time', r(st.rmCountered, st.rmLostPrev)) + stat('Rematch memory, model weight', pct(m.popRm.r)) : ''}</div>
      <p class="meta">New opponents start from this mix until their own fights say otherwise.</p></section>`;
    const track = `<section class="card"><div class="card-h"><h2>Model track record</h2></div>
      ${W.n ? `<div class="big-row"><span class="big-num">${pct(W.acc)}</span><span class="cap">of logged fights where the model's top pick was the order they actually played</span></div>
        <div>${stat('Guessing they repeat their last order', pct(W.repeatAcc))}${W.rmN ? stat(`On rematches only <span class="meta">(${W.rmN})</span>`, pct(W.rmHits / W.rmN)) : ''}${stat('Blind guess', '17%')}${stat('Average odds it gave the order they played', pct(W.avgP))}</div>
        <p class="meta">Each fight is called using only the fights before it, over ${plural(W.n, 'call')}.</p>` : '<p>Needs players with at least two logged fights.</p>'}</section>`;
    const mine = m.obsBy[m.meKey] || [];
    let me = '<section class="card"><div class="card-h"><h2>How readable you are</h2></div>';
    if (mine.length >= 2) {
      const ms = E.habitStats(mine), mw = wfMe();
      me += `<div class="stack">${tendRows(m.playerW[m.meKey])}</div>
        <div>${stat('You kept your previous order', r(ms.kept, ms.withPrev))}${mw && mw.n ? stat('The model would have called your order', pct(mw.acc)) : ''}</div>
        <p class="meta">This is how your opponents' scouting sees you. If you're easy to read, the safe mix on Next fight keeps you hard to counter.</p>`;
    } else {
      me += `<p>Log at least two of your own fights${baseSettings().me ? '' : ' and set your name in Setup'} to see how predictable you are.</p>`;
    }
    me += '</section>';
    const st2 = settings(), nb = isDemo() ? 0 : S.battles.length;
    let tune = `<section class="card"><div class="card-h"><h2>Tune the fight simulator</h2></div>
      <p>Right now a counter squad fights as if it had ${pct(+st2.bonus, 1)} more power, and real strength can drift about ${pct(+st2.sigma, 1)} from listed power.</p>`;
    if (isDemo()) tune += '<p class="meta">Tuning works on your own battles, not the example data.</p>';
    else if (nb < 8) tune += `<p class="meta">Log at least 8 battles to tune it (you have ${nb}).</p>`;
    else tune += `<div><button type="button" class="btn" data-act="cal"${S.busy ? ' disabled' : ''}>${S.busy === 'cal' ? 'Tuning…' : 'Tune to my battles'}</button></div>`;
    if (S.cal && !isDemo()) {
      const c = S.cal, same = Math.abs(c.best.bonus - st2.bonus) < 1e-9 && Math.abs(c.best.sigma - st2.sigma) < 1e-9 && Math.abs((c.best.attr || 1.5) - (+st2.attr || 1.5)) < 1e-9;
      tune += `<p>Best fit on ${c.level === 'encounter' ? `${plural(c.n, 'encounter')} from ${plural(c.battles, 'battle')}` : plural(c.n, 'battle')}: counter edge ${pct(c.best.bonus, 1)}, drift ${pct(c.best.sigma, 1)}. With those settings the stronger side wins ${pct(c.accuracy)} of the logged ${c.level === 'encounter' ? 'encounters' : 'fights'}.</p>
        ${same ? '<p class="meta">The tracker already uses these settings.</p>' : canAdmin() ? '<div><button type="button" class="btn primary" data-act="calapply">Use these settings</button></div>' : '<p class="meta">Only the tracker\'s owner can change these settings.</p>'}`;
    }
    tune += '</section>';
    return `<div class="grid2"><div class="stack" style="gap:16px">${pop}${me}</div><div class="stack" style="gap:16px">${track}${tune}</div></div>`;
  }

  /* ---------- Insights: where a player's own choices likely cost them ---------- */
  const INS = { k: '', v: null, busy: false };
  const colBest = (W, j) => { let b = 0; for (let i = 1; i < 6; i++) if (W[i][j] > W[b][j] + 1e-9) b = i; return b; };
  const TN = (t) => (t === 'X' ? 'mixed' : E.TYPE_NAME[t]);
  const fmtM = (p) => `${fmtP(p)}M`;
  const sumP = (form) => form.reduce((n, q) => n + q.p, 0);
  // "a 30% chance", "an 80% chance"
  const aP = (x) => { const s = pct(x); return (/^(8\d?|11|18)%$/.test(s) ? 'an ' : 'a ') + s; };
  // "about a 30% chance", or plain words at the extremes
  const chanceOf = (x) => (x < 0.005 ? 'almost no chance' : x > 0.995 ? 'a near-certain win' : `about ${aP(x)} chance`);
  // "their Aircraft squad (59.2M, 30% of its troops left)"
  const sqIn = (q, frac, whose, form) => `${whose} ${whose === 'your' ? sqName(q, form) : TN(q.t)} squad (${fmtM(q.p)}${frac < 0.95 ? `, ${pct(frac)} of its troops left` : ''})`;
  // A squad in a sentence: "Tank", or "94.9M Tank" when two of the player's squads share a type.
  const sqName = (q, form) => ((form || []).filter((x) => x.t === q.t).length > 1 ? `${fmtM(q.p)} ${TN(q.t)}` : TN(q.t));
  const sameSq = (a, b) => (a.id != null && b.id != null ? String(a.id) === String(b.id) : a.t === b.t && Math.abs(a.p - b.p) < 0.05);
  // What to change, in words, to get from the order played to a better one.
  function orderFix(played, better) {
    if (!sameSq(played[0], better[0])) return `led with your ${sqName(better[0], played)} squad`;
    if (!sameSq(played[1], better[1])) return `kept ${sqName(better[0], played)} first and sent your ${sqName(better[1], played)} squad second`;
    return null;
  }
  // One fight's encounters from this player's side, with the share of troops each squad had left going in.
  function encountersOf(e) {
    if (!Array.isArray(e.enc) || !e.enc.length || !e.side) return [];
    const mine = {}, theirs = {}, fullM = {}, fullT = {}, out = [], a = e.side === 'a';
    e.form.forEach((q) => { if (q.id != null) mine[String(q.id)] = q; });
    e.oppForm.forEach((q) => { if (q.id != null) theirs[String(q.id)] = q; });
    e.enc.forEach((x) => {
      const mid = String(a ? x[0] : x[1]), tid = String(a ? x[1] : x[0]), mq = mine[mid], tq = theirs[tid];
      if (!mq || !tq) return;
      const mb = +(a ? x[3] : x[5]), tb = +(a ? x[5] : x[3]);
      if (fullM[mid] == null) fullM[mid] = mb;
      if (fullT[tid] == null) fullT[tid] = tb;
      out.push({ mine: mq, theirs: tq, won: x[2] === e.side, mf: fullM[mid] > 0 ? mb / fullM[mid] : 1, tf: fullT[tid] > 0 ? tb / fullT[tid] : 1 });
    });
    return out;
  }
  // How much stronger your squad was going into an encounter: power x troops left x counter edge, yours over theirs.
  const edgeOf = (x, bonus) => (x.mf * x.mine.p * (E.BEATS[x.mine.t] === x.theirs.t ? 1 + bonus : 1)) / Math.max(1e-9, x.tf * x.theirs.p * (E.BEATS[x.theirs.t] === x.mine.t ? 1 + bonus : 1));
  const CLEAR_EDGE = 1.1; // "clearly the stronger side": 10% or more
  function insightsFor(pl) {

  // Each of a player's squads (by team) across all their fights: encounters fought and won, and losses while clearly stronger.

          rows: [they, you(r.played), { k: 'Better', form: r.ov.order, ch: r.ov.chance }] });

          p: `Your order had ${chanceOf(r.played)} against theirs; the better order below had about ${pct(r.best)}. ${scout}${sh && !sh.repeated && t.includes('risky') ? ` Your order was a weak answer to their R${sh.round} order too (${pct(sh.vs)}).` : ''}`,
          rows: [they, you(r.played), { k: 'Better', form: r.bestOrder, ch: r.best }] });

  /* ---------- Top 8: the race to advance (data/race.json, simulated at each daily import) ---------- */

      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { S.race = d && d.groups ? d : null; S.raceState = S.race ? 'ok' : 'none'; RACEIX = null; render(); })

  const fmtK = (k) => `${(k / 1000).toFixed(1)}M`; // thousands of points
  const fmtS = (v) => `${(v / 1e6).toFixed(2)}M`; // points

    const win = (x.r[5] || 1080) * 1000, loss = (x.r[6] || 330) * 1000;
    if (need <= left * loss) return 0;
    return Math.ceil((need - left * loss) / Math.max(1, win - loss));
  }
  const raceTag = (p) => (p > 0.9 ? ['ok', 'Should win'] : p >= 0.65 ? ['ok', 'Favoured'] : p >= 0.35 ? ['warn', 'Key match'] : p >= 0.1 ? ['', 'Underdog'] : ['bad', 'Play for kills']);
  function viewRace() {

    const me = settings().me, st = S.raceState;

    if (chance >= 0.99) verdict = `You're all but through. 8th place is likely to finish around ${cut}; your simulated finish averages ${fmtK(r[4])}.`;
    else if (chance < 0.01) verdict = `On current squad strength the top 8 is out of reach: 8th place is likely to finish around ${cut}, and your simulated finish averages ${fmtK(r[4])}. Every point still counts for your final place, so play for kills in fights you can't win.`;
    else {
      const w = winsNeeded(x);
      verdict = `8th place is likely to finish around ${cut}. From ${fmtS(r[1])} that takes about <b>${Math.min(w, left)} wins in your last ${left} fights</b>${w > left ? ' and some luck' : ''}. A win is worth about ${fmtK(r[5] || 1080)} to you, a loss about ${fmtK(r[6] || 330)}.`;
    }
    const head = `<section class="card">${title(`group ${esc(g)} · ${asOf}`)}
      <div class="big-row"><span class="big-num">${pct(chance)}</span><span class="cap">chance ${esc(r[0])} finishes in the top 8 of group ${esc(g)}</span></div>
      <div>${stat('Now', `#${x.i + 1} of ${G.p.length} · ${fmtS(r[1])} · ${r[2]}–${played - r[2]}`)}${stat('Rounds left', `${left}, 8 a day`)}</div>
      <p>${verdict}</p></section>`;
    const opps = r[7].slice().sort((a, b) => b[1] - a[1]);
    const keyN = opps.filter((o) => o[3] >= 0.35 && o[3] < 0.65).length, killN = opps.filter((o) => o[3] < 0.1).length;
    const oppRows = opps.map(([j, md, mn, pw]) => {
      const o = G.p[j], tg = raceTag(pw);
      return `<tr class="${tg[0] === 'warn' ? 'key' : ''}"><td><button type="button" class="linkbtn" data-act="raceopp" data-name="${esc(o[0])}">${esc(short(o[0]))}</button> <span class="meta">${o[2]}–${played - o[2]}</span><div><span class="tag ${tg[0]}">${tg[1]}</span></div></td><td>${pct(mn)}</td><td>${md.toFixed(1)}</td><td><b>${pct(pw)}</b></td></tr>`;
    }).join('');
    const oppCard = `<section class="card"><div class="card-h"><h2>Next 8 rounds</h2><span class="aside">who you'll likely meet</span></div>
      <p class="meta">${keyN ? `${plural(keyN, 'key match')} (about even): these decide your top 8. ` : ''}${killN ? `${killN === 1 ? 'One of them is' : killN + ' of them are'} out of reach, so play for kills there: Next fight shows the order that kills the most. ` : ''}Tap a name for the call.</p>
      <div class="scroll"><table class="race-opps"><thead><tr><th>Opponent</th><th>Next round</th><th>Meets</th><th>Win</th></tr></thead><tbody>${oppRows}</tbody></table></div>
      <p class="foot">Pairing goes by record with plenty of luck, so any single round is a guess. Meets = how many times you'd expect to face them in the next 8 rounds; Win = your chance against them.</p></section>`;
    const rows = G.p.map((p, i) => ({ p, i })).filter((o) => o.p[3] >= 0.01 || o.i < 12 || o.i === x.i).sort((a, b) => b.p[3] - a.p[3] || a.i - b.i);
    const raceCard = `<section class="card"><div class="card-h"><h2>Group ${esc(g)} race</h2><span class="aside">top 8 advance</span></div>
      <div class="scroll"><table class="race"><thead><tr><th>Player <span class="meta">(place now)</span></th><th>Top 8</th><th>Record</th><th>Score</th></tr></thead><tbody>
      ${rows.map((o) => `<tr class="${o.i === x.i ? 'me' : ''}"><td><span class="meta">#${o.i + 1}</span> ${esc(short(o.p[0]))}</td><td><span class="racebar"><span class="bar"><i style="width:${(o.p[3] * 100).toFixed(1)}%"></i></span><span class="pct">${pct(o.p[3])}</span></span></td><td>${o.p[2]}–${played - o.p[2]}</td><td>${fmtS(o.p[1])}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="foot">${R.runs.toLocaleString()} simulated runs of the last ${left} rounds. Each fight uses both players' latest squads and troops, mostly in their usual order, and pairing follows records the way it did on days 1–2. Tested on day 2, starting from the round-8 standings: of the players it gave 75–95%, 84% made the top 8; of those it gave under 5%, 3% did. It assumes squads stay as they are and everyone plays every round. Points: a loss scores 66 per enemy troop killed; a win scores 300,000 plus 66 per enemy troop killed and per troop you keep.</p></section>`;
    return `<div class="grid2"><div class="stack" style="gap:16px">${head}${oppCard}</div><div class="stack" style="gap:16px">${raceCard}</div></div>`;
  }
  // When no order wins: the order that scores the most points, i.e. kills the most of their troops.
  function killPlan(pr, pl) {
    const D = window.DuelRace;
    if (!D) return null;
    const me = fullIndex().players[key(settings().me)];
    const tmMe = me ? D.troopsOf(me.entries) : {}, tmOpp = pl ? D.troopsOf(pl.entries) : {};
    const avgOf = (m) => { const v = Object.values(m); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
    const fbMe = avgOf(tmMe) || avgOf(tmOpp) || 2800, fbOpp = avgOf(tmOpp) || fbMe;
    const trMine = pr.myCanon.map((q) => (q.id != null && tmMe[String(q.id)]) || fbMe);
    const trTheirs = pr.theirCanon.map((q) => (q.id != null && tmOpp[String(q.id)]) || fbOpp);
    const st = settings();
    const M = D.pointsMatrix(pr.myCanon, pr.theirCanon, trMine, trTheirs, { n: 200, sigma: +st.sigma, bonus: +st.bonus, attr: +st.attr || 1.5 });
    const exp = M.mine.map((row) => row.reduce((acc, v, j) => acc + v * pr.p[j], 0));
    return { exp, best: exp.indexOf(Math.max.apply(null, exp)), guessed: !Object.keys(tmMe).length || !Object.keys(tmOpp).length };
  }
  function killCard(pr, k) {
    const b = k.best, others = [0, 1, 2, 3, 4, 5].filter((i) => i !== b).sort((x, y) => k.exp[y] - k.exp[x]);
    const pts = (v) => `${Math.round(v / 1000).toLocaleString()}K`;
    return `<section class="card hero c-hero" aria-labelledby="h-kill">
      <div class="card-h"><h2 id="h-kill">Play for kills</h2><span class="stamp">vs ${esc(short(S.opp))}</span></div>
      ${permHTML(pr.myCanon, b, true)}
      <div class="big-row"><span class="big-num">${pts(k.exp[b])}</span><span class="cap">points you can expect: about ${Math.round(k.exp[b] / 66).toLocaleString()} of their troops killed, at 66 points each</span></div>
      <p class="callout">You can't win this one: the best order wins about ${pct(pr.ev[pr.best])}. A loss still scores 66 points per enemy troop you kill, so this order is set up to kill the most.${b !== pr.best ? ` The order with the best win chance would score about ${pts(k.exp[pr.best])}.` : ''}${k.guessed ? ' Troop counts are estimated, since a battle report is missing.' : ''}</p>
      <div class="scroll"><table><thead><tr><th>Other orders</th><th>Points</th><th>Win chance</th></tr></thead><tbody>
        ${others.map((i) => `<tr><td>${permHTML(pr.myCanon, i)}</td><td>${pts(k.exp[i])}</td><td>${pct(pr.ev[i])}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="foot">Whatever you play now becomes the formation your next opponent sees.</p>
    </section>`;
  }

  /* ---------- Standings: every group's published top 16, and the semi-final seeding ---------- */
  // The game publishes current scores only for each group's top 16, so those are the players listed (race.json keeps
  // them as the first rows of each group). Seeds: the top 8 of every group, ordered by total score.
  let STC = null;
  const ordinal = (n) => { const v = n % 100, sfx = ['th', 'st', 'nd', 'rd']; return n + (sfx[(v - 20) % 10] || sfx[v] || sfx[0]); };
  function standingsRows() {
    const R = S.race, P = fullIndex().players;
    if (STC && STC.race === R && STC.k === FIK) return STC.rows;
    const top = R.top || 16, adv = R.advance || 8, rows = [];
    Object.keys(R.groups).sort().forEach((g) => R.groups[g].p.slice(0, top).forEach((r, i) => {
      const pl = P[key(r[0])], last = pl && pl.entries.length ? pl.entries[pl.entries.length - 1] : null;
      rows.push({ g, gi: i, r, name: r[0], k: key(r[0]), score: r[1], wins: r[2], al: pl && pl.al ? String(pl.al) : '',
        power: last ? last.form.reduce((acc, q) => acc + (+q.p || 0), 0) : null, adv: i < adv });
    }));
    rows.sort((a, b) => b.score - a.score || (a.g < b.g ? -1 : a.g > b.g ? 1 : a.gi - b.gi));
    let seed = 0;
    rows.forEach((x, n) => { x.place = n + 1; x.seed = x.adv ? ++seed : null; });
    STC = { race: R, k: FIK, rows };
    return rows;
  }
  function viewStandings() {
    loadRace();
    const st = S.raceState;
    const title = (h, aside) => `<div class="card-h"><h2>${h}</h2>${aside ? `<span class="aside">${aside}</span>` : ''}</div>`;
    if (st !== 'ok') return `<section class="card">${title('Standings')}<div class="empty">${st === 'none' ? "Standings aren't available right now." : 'Loading the standings…'}</div></section>`;
    const R = S.race, adv = R.advance || 8, top = R.top || 16, played = R.round, asOf = `after round ${played} of ${R.rounds}`;
    const all = standingsRows(), groups = Object.keys(R.groups).sort(), seeds = all.filter((x) => x.adv);
    const scope = S.stScope === 'all' ? 'all' : 'seed', grp = groups.indexOf(S.stGroup) >= 0 ? S.stGroup : '', find = (S.stFind || '').trim().toLowerCase();
    const meK = key(settings().me || ''), mine = meK ? all.find((x) => x.k === meK) : null;
    const team = teamAlliance(), extra = new Set(EXTRA_MATES.map(key));
    const proj = all.some((x) => x.r[9]); // projected seeds, once the simulation carries them
    const rec = (x) => `${x.wins}–${played - x.wins}`;
    const gap = (v) => `${(Math.abs(v) / 1e6).toFixed(2)}M`;

    // Your seed
    let head = '';
    if (mine && mine.adv) {
      const above = seeds[mine.seed - 2], below = seeds[mine.seed];
      head = `<section class="card">${title('Your seed', asOf)}
        <div class="big-row"><span class="big-num">#${mine.seed}</span><span class="cap">of ${seeds.length}: where ${esc(mine.name)} would be seeded for the semi-finals if the qualifier ended now</span></div>
        <div>${stat(`Group ${esc(mine.g)}`, `${ordinal(mine.gi + 1)} · ${fmtS(mine.score)} · ${rec(mine)}`)}${above ? stat(`Seed ${above.seed}, just above`, `${esc(short(above.name))} · ${gap(above.score - mine.score)} ahead`) : ''}${below ? stat(`Seed ${below.seed}, just below`, `${esc(short(below.name))} · ${gap(mine.score - below.score)} behind`) : ''}${proj && mine.r[9] ? stat(`Likely seed after round ${R.rounds}`, `${mine.r[9][1]} (range ${mine.r[9][0]}–${mine.r[9][2]})`) : ''}</div></section>`;
    } else if (mine) {
      const last = all.find((x) => x.g === mine.g && x.gi === adv - 1);
      head = `<section class="card">${title('Your seed', asOf)}
        <p><b>${esc(mine.name)}</b> is ${ordinal(mine.gi + 1)} in group ${esc(mine.g)} with ${fmtS(mine.score)}. Only the top ${adv} of each group get a seed${last ? `: ${ordinal(adv)} place is ${esc(short(last.name))} at ${fmtS(last.score)}, ${gap(last.score - mine.score)} ahead` : ''}.</p></section>`;
    }

    // The list
    let list = all.filter((x) => (scope === 'all' || x.adv) && (!grp || x.g === grp));
    if (find) list = list.filter((x) => x.name.toLowerCase().indexOf(find) >= 0 || x.al.toLowerCase().indexOf(find) >= 0);
    const cols = 6 + (proj ? 2 : 0);
    const body = list.map((x) => {
      const cls = [x.k === meK ? 'me' : '', (x.al && x.al === team) || extra.has(x.k) ? 'mate' : '', x.adv ? '' : 'out'].filter(Boolean).join(' ');
      const cut = scope === 'all' && grp && !find && x.gi === adv ? `<tr class="cutline"><td colspan="${cols}">Top ${adv} advance</td></tr>` : '';
      const ps = proj ? `<td>${x.r[3] >= 0.995 ? '99%+' : pct(x.r[3])}</td><td>${x.r[9] ? `${x.r[9][1]} <span class="meta">${x.r[9][0]}–${x.r[9][2]}</span>` : '<span class="meta">–</span>'}</td>` : '';
      return `${cut}<tr class="${cls}"><td class="n">${scope === 'seed' ? x.seed : x.place}</td>
        <td class="who"><button type="button" class="linkbtn" data-act="raceopp" data-name="${esc(x.name)}">${esc(short(x.name))}</button>${x.al ? ` <span class="meta">${esc(x.al)}</span>` : ''}<div class="meta sub">Group ${esc(x.g)} · ${ordinal(x.gi + 1)} · ${rec(x)}</div></td>
        <td class="w">${esc(x.g)} <span class="meta">${ordinal(x.gi + 1)}</span></td><td class="w">${rec(x)}</td><td>${fmtS(x.score)}</td>${ps}<td class="w">${x.power ? x.power.toFixed(0) + 'M' : '–'}</td></tr>`;
    }).join('');
    const what = scope === 'seed'
      ? `The top ${adv} of each group advance: ${seeds.length} players in all. Their seed is their place by total score among those ${seeds.length}.`
      : `Each group's top ${top}, ranked by total score across all groups. Players outside their group's top ${adv} are greyed out.`;
    const ctl = `<div class="st-ctl">
        <div class="seg" role="group" aria-label="Players shown">
          <button type="button" data-act="stscope" data-v="seed" aria-pressed="${scope === 'seed'}">Semi-final seeds</button>
          <button type="button" data-act="stscope" data-v="all" aria-pressed="${scope === 'all'}">All top ${top}s</button>
        </div>
        <select id="st-group" aria-label="Group"><option value="">All groups</option>${groups.map((g) => `<option value="${esc(g)}"${g === grp ? ' selected' : ''}>Group ${esc(g)}</option>`).join('')}</select>
        <input id="st-find" type="text" autocomplete="off" spellcheck="false" aria-label="Find a player or alliance" placeholder="Player or alliance" value="${esc(S.stFind || '')}">
      </div>`;
    const table = list.length
      ? `<div class="scroll"><table class="stand"><thead><tr><th class="n">${scope === 'seed' ? 'Seed' : '#'}</th><th>Player</th><th class="w">Group</th><th class="w">Record</th><th>Score</th>${proj ? `<th>Top ${adv}</th><th>Likely seed</th>` : ''}<th class="w">Power</th></tr></thead><tbody>${body}</tbody></table></div>`
      : `<div class="empty">No player matches “${esc((S.stFind || '').trim())}”${grp ? ` in group ${esc(grp)}` : ''}.</div>`;
    const card = `<section class="card">${title(scope === 'seed' ? 'Semi-final seeding' : 'Overall standings', `${grp ? `group ${esc(grp)} · ` : ''}${asOf}`)}
      ${ctl}
      <p class="meta">${what} Tap a name to scout that player.</p>
      ${table}
      <p class="foot">The game only publishes current scores for each group's top ${top}, so those are the players listed. Seeds show where things stand today and will move every round until round ${R.rounds}.${proj ? ` Likely seed: the middle result of the simulated last ${R.rounds - played} rounds, with the range it lands in 8 times out of 10, counted only when the player makes the top ${adv}.` : ''}</p></section>`;
    return `<div class="stack" style="gap:16px">${head}${card}</div>`;
  }

  /* ---------- Setup ---------- */

  }
